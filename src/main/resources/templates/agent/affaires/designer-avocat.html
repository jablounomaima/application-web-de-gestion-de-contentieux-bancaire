<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Désigner un avocat</title>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 40px;
               background: #f5f5f5; color: #333; }
        h2 { margin-bottom: 4px; }
        .subtitle { color: #777; margin-bottom: 24px; font-size: 14px; }

        .alert { padding: 12px 16px; border-radius: 4px;
                 margin-bottom: 16px; max-width: 600px; }
        .alert-success { background:#d4edda; color:#155724;
                         border:1px solid #c3e6cb; }
        .alert-error   { background:#f8d7da; color:#721c24;
                         border:1px solid #f5c6cb; }

        .card { background: white; padding: 28px; border-radius: 6px;
                max-width: 600px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
                margin-bottom: 20px; }
        .card-title { font-size: 15px; font-weight: bold; color: #1e3a5f;
                      margin: 0 0 20px; padding-bottom: 10px;
                      border-bottom: 2px solid #eee; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: bold;
                color: #555; margin-bottom: 6px; }
        select, input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 10px 12px;
            border: 1px solid #ddd; border-radius: 4px;
            font-size: 14px; color: #333; }
        select:focus, input:focus, textarea:focus {
            outline: none; border-color: #2563eb; }

        .avocat-card { border: 1px solid #e0e7ff; border-radius: 6px;
                       padding: 12px 16px; margin-bottom: 8px;
                       cursor: pointer; transition: all .2s; }
        .avocat-card:hover { border-color: #2563eb;
                             background: #f0f4ff; }
        .avocat-card input[type="radio"] { margin-right: 10px; }
        .avocat-nom { font-weight: bold; font-size: 14px; color: #1e3a5f; }
        .avocat-info { font-size: 12px; color: #777; margin-top: 3px; }

        .actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn { padding: 11px 22px; border-radius: 4px; font-size: 14px;
               cursor: pointer; border: none; text-decoration: none;
               display: inline-block; font-weight: bold; }
        .btn-primary { background: linear-gradient(135deg, #1e3a5f, #2563eb);
                       color: white; }
        .btn-primary:hover { background: linear-gradient(135deg,
                             #152b47, #1d4ed8); }
        .btn-back { background: #777; color: white; }
    </style>
</head>
<body>

<h2>👨‍⚖️ Désigner un avocat</h2>
<p class="subtitle">
    Dossier ID : <b th:text="${dossierId}"></b> —
    Prestation : <b th:text="${prestationId}"></b>
</p>

<!-- Messages flash -->
<div th:if="${successMsg}" class="alert alert-success"
     th:text="${successMsg}"></div>
<div th:if="${errorMsg}"   class="alert alert-error"
     th:text="${errorMsg}"></div>

<div class="card">
    <div class="card-title">⚖️ Choisir un avocat</div>

    <form th:action="@{/agent/dossiers/{dossierId}/prestation/{prestationId}/designer-avocat(
                        dossierId=${dossierId},
                        prestationId=${prestationId})}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <!-- ── Liste des avocats ── -->
        <div class="form-group">
            <label>Sélectionnez un avocat *</label>

            <div th:if="${avocats == null or avocats.empty}"
                 style="color:#e74c3c;font-size:13px;padding:12px;
                        background:#fdf0f0;border-radius:4px">
                ⚠️ Aucun avocat actif disponible.
                Vérifiez que des prestataires de type AVOCAT sont enregistrés.
            </div>

            <div th:each="avocat : ${avocats}" class="avocat-card">
                <label style="cursor:pointer;display:flex;
                               align-items:flex-start;gap:10px;margin:0">
                    <input type="radio"
                           name="prestataireId"
                           th:value="${avocat.id}"
                           required
                           style="margin-top:3px;width:auto"/>
                    <div>
                        <div class="avocat-nom"
                             th:text="${avocat.nom + ' ' + avocat.prenom}">
                        </div>
                        <div class="avocat-info"
                             th:text="'📧 ' + ${avocat.email}
                                      + ' | 📞 ' + ${avocat.telephone}">
                        </div>
                        <div class="avocat-info"
                             th:if="${avocat.specialite != null}"
                             th:text="'⚖️ Spécialité : ' + ${avocat.specialite}">
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <!-- ── Description (optionnelle) ── -->
        <div class="form-group">
            <label>Description de la mission (optionnel)</label>
            <textarea name="description" rows="3"
                      placeholder="Instructions particulières pour l'avocat..."></textarea>
        </div>

        <!-- ── Date de fin prévue (optionnelle) ── -->
        <div class="form-group">
            <label>Date de fin prévue (optionnel)</label>
            <input type="date" name="dateFinPrevue"/>
        </div>

        <!-- ── Boutons ── -->
        <div class="actions">
            <button type="submit" class="btn btn-primary"
                    th:if="${avocats != null and !avocats.empty}">
                ✅ Confirmer la désignation
            </button>
            <a th:href="@{/agent/dossiers/{id}(id=${dossierId})}"
               class="btn btn-back">
                ← Retour au dossier
            </a>
        </div>

    </form>
</div>

</body>
</html>
