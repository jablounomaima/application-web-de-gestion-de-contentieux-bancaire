<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Affaire judiciaire — Agent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #f5f6fa; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
        .section-title { font-size: .75rem; font-weight: 600; text-transform: uppercase;
                         letter-spacing: .06em; color: #6c757d; margin-bottom: .75rem; }
        .doc-row:hover { background: #f0f4ff; }
        .timeline-item { border-left: 2px solid #dee2e6; padding-left: 1rem;
                         padding-bottom: 1rem; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -5px; top: 6px;
                                  width: 8px; height: 8px; border-radius: 50%;
                                  background: #0d6efd; }
        .timeline-item:last-child { border-left-color: transparent; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">Contentieux — Agent</span>
    <div class="ms-auto">
        <a th:href="@{/agent/dossiers/{id}(id=${dossierId})}"
           class="text-white text-decoration-none me-3">
            <i class="bi bi-arrow-left"></i> Retour au dossier
        </a>
    </div>
</nav>

<div class="container-fluid py-4 px-4">

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- CAS : PAS D'AFFAIRE ENCORE -->
    <div th:if="${pasDAffaire}" class="text-center py-5">
        <i class="bi bi-file-earmark-x fs-1 text-muted d-block mb-3"></i>
        <h5 class="text-muted">Aucune affaire judiciaire ouverte pour ce dossier</h5>
        <a th:href="@{/agent/dossiers/{id}/affaire/lancer(id=${dossierId})}"
           class="btn btn-primary mt-3">
            <i class="bi bi-play-fill me-1"></i>Lancer une affaire
        </a>
    </div>

    <!-- CAS : AFFAIRE EXISTANTE -->
    <div th:if="${affaire}">
        <div class="d-flex align-items-center gap-3 mb-4">
            <h4 class="mb-0 fw-bold" th:text="${affaire.numeroAffaire}"></h4>
            <span class="badge rounded-pill bg-primary px-3 py-2"
                  th:text="${affaire.statut}"></span>
        </div>

        <div class="row g-4">

            <!-- Résumé affaire -->
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="section-title">Tribunal</div>
                        <div class="mb-2">
                            <small class="text-muted">Tribunal</small>
                            <div class="fw-semibold" th:text="${affaire.tribunal ?: '—'}"></div>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">N° de rôle</small>
                            <div th:text="${affaire.numeroRole ?: '—'}"></div>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">Chambre</small>
                            <div th:text="${affaire.chambre ?: '—'}"></div>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">Avocat désigné</small>
                            <div class="fw-semibold"
                                 th:text="${affaire.mission.prestataire.prenom + ' ' + affaire.mission.prestataire.nom}"></div>
                        </div>
                        <div>
                            <small class="text-muted">Prochaine audience</small>
                            <div class="text-primary fw-semibold"
                                 th:if="${affaire.dateProchainAudience}"
                                 th:text="${#temporals.format(affaire.dateProchainAudience,'dd/MM/yyyy')}"></div>
                            <div class="text-muted" th:unless="${affaire.dateProchainAudience}">—</div>
                        </div>
                    </div>
                </div>

                <!-- Jugement -->
                <div class="card" th:if="${affaire.typeJugement != null}">
                    <div class="card-body">
                        <div class="section-title">Jugement</div>
                        <span class="badge mb-2"
                              th:classappend="${affaire.typeJugement.name() == 'FAVORABLE'} ? 'bg-success' : 'bg-danger'"
                              th:text="${affaire.typeJugement}"></span>
                        <div class="mb-2">
                            <small class="text-muted">Date</small>
                            <div th:text="${#temporals.format(affaire.dateJugement,'dd/MM/yyyy')}"></div>
                        </div>
                        <div class="mb-2" th:if="${affaire.montantJuge}">
                            <small class="text-muted">Montant jugé</small>
                            <div class="fw-bold text-success" th:text="${affaire.montantJuge}"></div>
                        </div>
                        <div th:if="${affaire.delaiPaiementJuge}">
                            <small class="text-muted">Délai</small>
                            <div th:text="${affaire.delaiPaiementJuge}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Timeline audiences -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <div class="section-title">Audiences
                            (<span th:text="${affaire.audiences.size()}"></span>)
                        </div>
                        <div th:if="${affaire.audiences.empty}" class="text-muted text-center py-3">
                            <i class="bi bi-calendar3 d-block fs-3 mb-1"></i>
                            Aucune audience
                        </div>
                        <div th:each="aud : ${affaire.audiences}" class="timeline-item">
                            <div class="fw-semibold small"
                                 th:text="${#temporals.format(aud.dateAudience,'dd/MM/yyyy')}"></div>
                            <span class="badge rounded-pill"
                                  style="font-size:.65rem"
                                  th:classappend="${aud.statut.name() == 'TENUE'} ? 'bg-success' :
                                                  (${aud.statut.name() == 'RENVOYEE'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                  th:text="${aud.statut}"></span>
                            <div class="text-muted small mt-1" th:if="${aud.resultat}"
                                 th:text="${aud.resultat}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Documents -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <div class="section-title">Documents
                            (<span th:text="${affaire.documents.size()}"></span>)
                        </div>
                        <div th:if="${affaire.documents.empty}" class="text-muted text-center py-3">
                            <i class="bi bi-folder2-open d-block fs-3 mb-1"></i>
                            Aucun document
                        </div>
                        <div th:each="doc : ${affaire.documents}"
                             class="d-flex align-items-center gap-2 p-2 rounded doc-row mb-1">
                            <i class="bi text-primary" th:classappend="${doc.iconeType}"></i>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="small fw-semibold text-truncate"
                                     th:text="${doc.nomFichierOriginal}"></div>
                                <div style="font-size:.7rem" class="text-muted">
                                    <span th:text="${doc.typeDocument}"></span> ·
                                    <span th:text="${doc.tailleFormatee}"></span>
                                </div>
                            </div>
                            <!-- L'agent peut télécharger mais PAS supprimer -->
                            <a th:href="@{/agent/dossiers/{dId}/affaire/documents/{docId}/download
                                         (dId=${dossierId},docId=${doc.id})}"
                               class="btn btn-sm btn-outline-primary"
                               title="Télécharger">
                                <i class="bi bi-download"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
