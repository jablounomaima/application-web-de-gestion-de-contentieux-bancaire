<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Dossiers Contentieux</title>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 40px;
               background: #f5f5f5; color: #333; }
        h2 { color: #2c3e50; margin-bottom: 4px; }
        .subtitle { color: #777; margin-bottom: 20px; font-size: 14px; }

        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
        .alert-success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .alert-error   { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }

        .stats { margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
        .card {
            padding: 14px 20px; background: white; border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); font-size: 14px; min-width: 130px;
        }
        .card b { display: block; font-size: 22px; color: #2c3e50; margin-top: 2px; }

        .btn {
            padding: 7px 14px; text-decoration: none; border-radius: 4px;
            font-size: 13px; display: inline-block; cursor: pointer; border: none;
        }
        .btn-detail { background: #3498db; color: white; }
        .btn-create { background: #2ecc71; color: white; }
        .btn-delete { background: #e74c3c; color: white; }

        .notif-bar {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 16px;
        }

        table {
            width: 100%; border-collapse: collapse; background: white;
        }
        th, td { padding: 10px; text-align: center; }

        .badge {
            padding: 3px 9px; border-radius: 12px;
            font-size: 11px; font-weight: bold;
        }

        .action-cell {
            display: flex; gap: 6px;
            justify-content: center;
        }
    </style>
</head>
<body>

<h2>Gestion des dossiers contentieux</h2>
<p class="subtitle">Bonjour <b sec:authentication="name">–</b></p>

<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

<div class="notif-bar">
    <a class="btn btn-create" th:href="@{/agent/dossiers/create}">
        ➕ Créer un dossier
    </a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Numéro</th>
        <th>Client</th>
        <th>Statut</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <!-- ✅ Correction empty -->
    <tr th:if="${dossiers == null or #lists.isEmpty(dossiers)}">
        <td colspan="6">Aucun dossier</td>
    </tr>

    <tr th:each="dossier : ${dossiers}">

        <td th:text="${dossier.id}"></td>
        <td th:text="${dossier.numeroDossier}"></td>

        <td th:text="${dossier.client != null ?
                      dossier.client.nom + ' ' + dossier.client.prenom : '–'}">
        </td>

        <td th:text="${dossier.statut}"></td>

        <!-- ✅ Correction date -->
        <td th:text="${dossier.dateCreation != null ?
                     #temporals.format(dossier.dateCreation, 'dd/MM/yyyy') : '–'}">
        </td>

        <td>
            <div class="action-cell">

                <a class="btn btn-detail"
                   th:href="@{/agent/dossiers/{id}(id=${dossier.id})}">
                    👁
                </a>

                <!-- ✅ SUPPRESSION SANS CSRF -->
                <form th:action="@{/agent/dossiers/{id}/supprimer(id=${dossier.id})}"
                      method="post"
                      onsubmit="return confirm('Supprimer ce dossier ?')">

                    <button type="submit" class="btn btn-delete">
                        🗑
                    </button>
                </form>

            </div>
        </td>

    </tr>
    </tbody>
</table>

</body>
</html>
