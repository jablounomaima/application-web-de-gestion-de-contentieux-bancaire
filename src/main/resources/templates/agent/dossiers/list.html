<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Mes dossiers</title>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 40px;
               background: #f5f5f5; color: #333; }
        h2 { color: #2c3e50; margin-bottom: 4px; }
        .subtitle { color: #777; margin-bottom: 20px; font-size: 14px; }
        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
        .alert-success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .alert-error   { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }

        /* ── Recherche ── */
        .search-bar { display:flex; gap:10px; margin-bottom:20px; }
        .search-bar input {
            flex:1; padding:10px 14px; border:1.5px solid #e2e8f0;
            border-radius:8px; font-size:14px; font-family:Arial;
            background:white; outline:none;
        }
        .search-bar input:focus { border-color:#2563eb; }
        .btn-search {
            padding:10px 20px; background:#2563eb; color:white;
            border:none; border-radius:8px; font-size:14px; cursor:pointer;
        }
        .btn-reset {
            padding:10px 16px; background:transparent; color:#777;
            border:1.5px solid #e2e8f0; border-radius:8px;
            font-size:14px; text-decoration:none;
        }
        .search-result { font-size:13px; color:#777; margin-bottom:14px; }

        /* ── Actions bar ── */
        .actions-bar { display:flex; justify-content:space-between;
                       align-items:center; margin-bottom:16px; }
        .btn { padding:8px 16px; text-decoration:none; border-radius:6px;
               font-size:13px; display:inline-block; cursor:pointer; border:none; }
        .btn-create { background:#2ecc71; color:white; }
        .btn-detail { background:#3498db; color:white; }
        .btn-delete { background:#e74c3c; color:white; }

        /* ── Table ── */
        table { width:100%; border-collapse:collapse; background:white;
                border-radius:8px; overflow:hidden;
                box-shadow:0 1px 4px rgba(0,0,0,.08); }
        th, td { padding:11px 14px; text-align:center;
                 border-bottom:1px solid #eee; font-size:13px; }
        th { background:#1e3a5f; color:white; font-weight:600; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:#f9f9f9; }

        /* ── Badges statut ── */
        .badge { display:inline-block; padding:3px 10px; border-radius:12px;
                 font-size:11px; font-weight:bold; text-transform:uppercase; }
        .badge-OUVERT          { background:#cce5ff; color:#004085; }
        .badge-EN_TRAITEMENT   { background:#fff3cd; color:#856404; }
        .badge-VALIDE          { background:#d4edda; color:#155724; }
        .badge-EN_PROCEDURE    { background:#e0e7ff; color:#3730a3; }
        .badge-EN_EXECUTION    { background:#fce7f3; color:#9d174d; }
        .badge-REJETE          { background:#f8d7da; color:#721c24; }
        .badge-CLOTURE         { background:#e2e3e5; color:#383d41; }
        .badge-CLOTURE_PARTIEL { background:#fef3c7; color:#92400e; }

        .action-cell { display:flex; gap:6px; justify-content:center; }
        .empty-row td { color:#aaa; font-style:italic; padding:30px; }
    </style>
</head>
<body>

<h2>Mes dossiers contentieux</h2>
<p class="subtitle">Connecté : <b sec:authentication="name">–</b></p>

<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

<!-- ── Barre de recherche ── -->
<form th:action="@{/agent/dossiers}" method="get" class="search-bar">
    <input type="text" name="recherche"
           th:value="${recherche}"
           placeholder="Rechercher par numéro dossier ou CIN client..."/>
    <button type="submit" class="btn-search">Rechercher</button>
    <a th:if="${recherche != null and !recherche.isEmpty()}"
       th:href="@{/agent/dossiers}" class="btn-reset">Effacer</a>
</form>

<!-- ── Résultat recherche ── -->
<div th:if="${recherche != null and !recherche.isEmpty()}" class="search-result">
    <span th:if="${totalDossiers > 0}">
        <b th:text="${totalDossiers}"></b> résultat(s) pour
        "<b th:text="${recherche}"></b>"
    </span>
    <span th:if="${totalDossiers == 0}" style="color:#e74c3c;">
        Aucun dossier trouvé pour "<b th:text="${recherche}"></b>"
    </span>
</div>

<!-- ── Actions ── -->
<div class="actions-bar">
    <a class="btn btn-create" th:href="@{/agent/dossiers/create}">
        + Créer un dossier
    </a>
    <span style="font-size:13px;color:#777;">
        Total : <b th:text="${totalDossiers}">0</b> dossier(s)
    </span>
</div>

<!-- ── Tableau ── -->
<table>
    <thead>
    <tr>
        <th>N° Dossier</th>
        <th>Client</th>
        <th>CIN</th>
        <th>RNE</th>
        <th>Statut</th>
        <th>Date création</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>

    <tr th:if="${dossiers == null or #lists.isEmpty(dossiers)}" class="empty-row">
        <td colspan="6">Aucun dossier trouvé.</td>
    </tr>

    <tr th:each="dossier : ${dossiers}">
        <td style="font-weight:bold" th:text="${dossier.numeroDossier} ?: '–'"></td>
        <td th:text="${dossier.client != null ?
                      dossier.client.nom + ' ' + dossier.client.prenom : '–'}"></td>
                      
        <td th:text="${dossier.client != null ? dossier.client.cin : '–'}"></td>
        <td th:text="${dossier.client != null ? dossier.client.rne : '–'}"></td>
        <td>
            <!-- ✅ Badge coloré selon statut -->
            <span class="badge"
                  th:classappend="'badge-' + ${dossier.statut.name()}"
                  th:text="${dossier.statut.name()}">
            </span>
        </td>
        <td th:text="${dossier.dateCreation != null ?
                     #temporals.format(dossier.dateCreation, 'dd/MM/yyyy') : '–'}"></td>
        <td>
            <div class="action-cell">
                <a class="btn btn-detail"
                   th:href="@{/agent/dossiers/{id}(id=${dossier.id})}">
                    Voir
                </a>
                <form th:action="@{/agent/dossiers/{id}/supprimer(id=${dossier.id})}"
                      method="post"
                      th:if="${dossier.statut.name() == 'OUVERT'}"
                      onsubmit="return confirm('Supprimer ce dossier ?')">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-delete">Supprimer</button>
                </form>
                <form th:action="@{/agent/dossiers/{id}/supprimer(id=${dossier.id})}" method="post" onsubmit="return confirm('Supprimer ce dossier ?')"> <button type="submit" class="btn btn-delete"> 🗑 </button> </form>
            </div>
        </td>
    </tr>

    </tbody>
</table>


<script>
    function toggleForm() {
        const form = document.getElementById("createForm");
        form.style.display = (form.style.display === "none") ? "block" : "none";
    }
    
    function toggleClientType(value) {
    const cinDiv = document.getElementById("cinDiv");
    const rneDiv = document.getElementById("rneDiv");
    const raisonDiv = document.getElementById("raisonDiv");

    const cinInput = document.querySelector("[name='cin']");
    const rneInput = document.querySelector("[name='rne']");
    const raisonInput = document.querySelector("[name='raisonSociale']");

    if (value === "ENTREPRISE") {
        cinDiv.style.display = "none";
        rneDiv.style.display = "block";
        raisonDiv.style.display = "block";

        // 🔥 IMPORTANT
        cinInput.value = "";          // vider
        cinInput.readOnly = true;     // bloquer sans supprimer

        rneInput.readOnly = false;
        raisonInput.readOnly = false;

    } else {
        cinDiv.style.display = "block";
        rneDiv.style.display = "none";
        raisonDiv.style.display = "none";

        // 🔥 IMPORTANT
        rneInput.value = "";
        raisonInput.value = "";

        cinInput.readOnly = false;
        rneInput.readOnly = true;
        raisonInput.readOnly = true;
    }
}
    function toggleRaisonSociale(val) {
    const isEntreprise = val === 'ENTREPRISE';

    const raisonDiv = document.getElementById('raisonSocialeDiv');
    const rneDiv = document.getElementById('rneDiv');
    const cinDiv = document.getElementById('cinDiv');

    const raisonInput = document.querySelector("[name='clientRaisonSociale']");
    const rneInput = document.querySelector("[name='clientRne']");
    const cinInput = document.querySelector("[name='clientCin']");

    // 🎯 Affichage
    raisonDiv.style.display = isEntreprise ? 'flex' : 'none';
    rneDiv.style.display = isEntreprise ? 'flex' : 'none';
    cinDiv.style.display = isEntreprise ? 'none' : 'flex';

    // 🔥 TRÈS IMPORTANT → empêcher envoi
    raisonInput.disabled = !isEntreprise;
    rneInput.disabled = !isEntreprise;
    cinInput.disabled = isEntreprise;
}
    </script>

</body>
</html>
