<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Modifier la garantie</title>
    <style>
        *{box-sizing:border-box;}
        body{font-family:Arial,sans-serif;margin:0;padding:40px;background:#f0f4f8;color:#333;}
        .page-header{max-width:700px;margin-bottom:20px;}
        .page-header h2{margin:0;font-size:22px;color:#1e3a5f;}
        .subtitle{font-size:13px;color:#777;}
        .breadcrumb{font-size:12px;margin-bottom:18px;color:#94a3b8;}
        .breadcrumb a{color:#3498db;text-decoration:none;}
        .card{background:white;border-radius:10px;max-width:700px;box-shadow:0 2px 12px rgba(0,0,0,0.08);}
        .card-header{background:linear-gradient(135deg,#1e3a5f,#2d5282);color:white;padding:16px 22px;border-radius:10px 10px 0 0;}
        .card-header h3{margin:0;font-size:15px;}
        .card-body{padding:22px;}
        .form-group{margin-bottom:14px;}
        label{font-size:12px;font-weight:bold;color:#475569;display:block;margin-bottom:6px;text-transform:uppercase;}
        input,select,textarea{width:100%;padding:10px;border-radius:6px;border:1px solid #e2e8f0;background:#f8fafc;font-size:14px;}
        textarea{min-height:90px;}
        .actions{display:flex;gap:10px;margin-top:20px;}
        .btn{padding:10px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:bold;font-size:14px;}
        .btn-save{background:#27ae60;color:white;}
        .btn-cancel{background:#e2e8f0;color:#333;text-decoration:none;display:inline-block;}
    </style>
</head>
<body>

<div class="page-header">
    <h2>Modifier la garantie</h2>
    <div class="subtitle">Connecté : <b sec:authentication="name">user</b></div>
</div>

<div class="breadcrumb">
    <a href="/agent/dossiers">Dossiers</a> ›
    <a th:href="@{/agent/dossiers/{id}(id=${dossierId})}">Dossier</a> ›
    <span>Modifier garantie</span>
</div>

<div class="card">
    <div class="card-header">
        <h3>Informations de la garantie</h3>
    </div>
    <div class="card-body">

        <!-- ✅ URL complète avec dossierId + risqueId + id -->
        <form th:action="@{/agent/dossiers/garanties/{gId}/edit(gId=${garantie.id})}"
      method="post">
              

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label>Type de garantie *</label>
                <select name="typeGarantie" required>
                    <option value="">-- Sélectionner --</option>
                    <option value="Hypothèque"          th:selected="${garantie.typeGarantie == 'Hypothèque'}">Hypothèque</option>
                    <option value="Nantissement"        th:selected="${garantie.typeGarantie == 'Nantissement'}">Nantissement</option>
                    <option value="Caution personnelle" th:selected="${garantie.typeGarantie == 'Caution personnelle'}">Caution personnelle</option>
                    <option value="Gage"                th:selected="${garantie.typeGarantie == 'Gage'}">Gage</option>
                    <option value="Véhicule"            th:selected="${garantie.typeGarantie == 'Véhicule'}">Véhicule</option>
                    <option value="Immobilier"          th:selected="${garantie.typeGarantie == 'Immobilier'}">Immobilier</option>
                    <option value="Assurance"           th:selected="${garantie.typeGarantie == 'Assurance'}">Assurance</option>
                    <option value="Autre"               th:selected="${garantie.typeGarantie == 'Autre'}">Autre</option>
                </select>
            </div>

            <div class="form-group">
                <label>Valeur estimée (DT)</label>
                <input type="number" name="valeurEstimee"
                       th:value="${garantie.valeurEstimee}"
                       step="0.01" min="0" placeholder="Ex: 50000"/>
            </div>

            <div class="form-group">
                <label>Référence document</label>
                <input type="text" name="documentRef"
                       th:value="${garantie.documentRef}"
                       placeholder="N° immatriculation, titre foncier..."/>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description"
                          th:text="${garantie.description}"
                          placeholder="Description de la garantie..."></textarea>
            </div>

            <div class="actions">
                <button class="btn btn-save" type="submit">Enregistrer</button>
                <a class="btn btn-cancel"
                   th:href="@{/agent/dossiers/{id}(id=${dossierId})}">Annuler</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
