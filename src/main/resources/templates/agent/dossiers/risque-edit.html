<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="'Modifier crédit - ' + ${risque.type}">Modifier crédit</title>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
            color: #333;
        }

        h2 { color: #2c3e50; margin-bottom: 4px; }
        .subtitle { color: #777; margin-bottom: 24px; font-size: 14px; }

        .breadcrumb {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }
        .breadcrumb a { color: #3498db; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; max-width: 800px; }
        .alert-success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .alert-error { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }

        .card {
            background: white;
            padding: 28px;
            border-radius: 6px;
            max-width: 800px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 14px; font-weight: bold; color: #555;
            margin: 0 0 20px; padding-bottom: 8px;
            border-bottom: 2px solid #eee;
        }

        .form-group { margin-bottom: 18px; }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,.1);
        }

        textarea { resize: vertical; min-height: 80px; }
        .hint { font-size: 12px; color: #aaa; margin-top: 4px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-block;
        }
        .btn-save { background: #2ecc71; color: white; }
        .btn-save:hover { background: #27ae60; }
        .btn-back { background: #777; color: white; }
        .btn-back:hover { background: #555; }
        .btn-add { background: #3498db; color: white; font-size: 13px; padding: 8px 16px; }
        .btn-add:hover { background: #2980b9; }
        .btn-delete { 
            background: #e74c3c; 
            color: white; 
            font-size: 12px; 
            padding: 6px 12px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .btn-delete:hover { background: #c0392b; }

        /* ── GARANTIES ── */
        .garantie-block {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .garantie-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .garantie-type {
            font-weight: bold;
            color: #495057;
            font-size: 14px;
        }

        .garantie-valeur {
            color: #28a745;
            font-weight: bold;
            font-family: monospace;
            font-size: 14px;
        }

        .garantie-desc {
            font-size: 13px;
            color: #6c757d;
            margin-top: 4px;
        }

        .garantie-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #dee2e6;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-style: italic;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .section-separator {
            border-top: 2px solid #eee;
            margin: 24px 0;
            padding-top: 24px;
        }

        /* Badge sélection */
        .badge-selected {
            display: inline-block;
            background: #d4edda;
            color: #155724;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<!-- Fil d'Ariane -->
<div class="breadcrumb">
    <a th:href="@{/agent/dossiers}">Dossiers</a> → 
    <a th:if="${dossier != null}"
    th:href="@{/agent/dossiers/{id}(id=${dossier.id})}" th:text="${dossier.numeroDossier}">Dossier</a> → 
    <a th:href="@{/agent/dossiers/{id}/edit(id=${dossier.id})}">Modification</a> → 
    <span th:text="'Crédit: ' + ${risque.type}">Crédit</span>
</div>

<h2>
    Modifier le crédit
    <span th:if="${risque.selectionne}" class="badge-selected">★ SÉLECTIONNÉ</span>
</h2>
<p class="subtitle">
    Agent connecté : <b sec:authentication="name">–</b> | 
    Dossier : <b th:text="${dossier.numeroDossier}">–</b>
</p>

<!-- Messages flash -->
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

<!-- ── INFORMATIONS DU CRÉDIT ── -->
<div class="card">
    <div class="card-title">Informations du crédit</div>
    
    <form th:action="@{/agent/dossiers/risques/{rId}/modifier(rId=${risque.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        
        <div class="grid-2">
            <div class="form-group">
                <label for="type">Type de crédit <span style="color:red">*</span></label>
                <input type="text" id="type" name="type" th:value="${risque != null ? risque.type : ''}" required/>
            </div>
            
            <div class="form-group">
                <label for="dateEcheance">Date d'échéance</label>
                <input type="date" id="dateEcheance" name="dateEcheance" th:value="${risque.dateEcheance}"/>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="form-group">
                <label for="montantInitial">Montant initial (DT)</label>
                <input type="number" step="0.001" id="montantInitial" name="montantInitial" 
                       th:value="${risque.montantInitial}" placeholder="0.000"/>
            </div>
            
            <div class="form-group">
                <label for="montantImpaye">Montant impayé (DT)</label>
                <input type="number" step="0.001" id="montantImpaye" name="montantImpaye" 
                       th:value="${risque.montantImpaye}" placeholder="0.000"/>
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" 
                      th:text="${risque.description}" 
                      placeholder="Description du crédit"></textarea>
        </div>
        
        <div class="actions">
            <button type="submit" class="btn btn-save">💾 Enregistrer les modifications</button>
            <a th:href="@{/agent/dossiers/{id}/edit(id=${dossier.id})}" class="btn btn-back">← Retour à la liste</a>
        </div>
    </form>
</div>

<!-- ── GARANTIES EXISTANTES ── -->
<div class="card">
    <div class="card-title">Garanties associées</div>
    
    <!-- Liste des garanties -->
    <div th:if="${risque.garanties != null and !#lists.isEmpty(risque.garanties)}">    
        <div th:each="g : ${risque.garanties}"
        th:if="${g != null}"
        class="garantie-block">
            <div class="garantie-header">
                <div>
                    <div class="garantie-type" th:text="${g.typeGarantie} ?: '–'"></div>
                    <div class="garantie-desc" th:if="${g.description}" th:text="${g.description}"></div>
                    <div class="garantie-desc" th:if="${g.documentRef}" 
                         th:text="'Référence: ' + ${g.documentRef}"></div>
                </div>
                <div class="garantie-valeur" th:if="${g.valeurEstimee != null}" 
                     th:text="${#numbers.formatDecimal(g.valeurEstimee,1,'COMMA',3,'POINT')} + ' DT'"></div>
            </div>
            
            <div class="garantie-actions">
                <form th:if="${g.id != null}"
      th:action="@{/agent/dossiers/garanties/{gId}/supprimer(gId=${g.id})}"
                      method="post" style="margin:0;"
                      onsubmit="return confirm('Confirmer la suppression de cette garantie ?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-delete">🗑 Supprimer</button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Aucune garantie -->
    <div th:if="${risque.garanties == null or risque.garanties.empty}" class="empty-state">
        Aucune garantie associée à ce crédit.
    </div>
</div>

<!-- ── AJOUTER UNE GARANTIE ── -->
<div class="card">
    <div class="card-title">Ajouter une garantie</div>
    
    <form th:action="@{/agent/dossiers/risques/{rId}/garanties/ajouter(rId=${risque.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        
        <div class="grid-2">
            <div class="form-group">
                <label for="typeGarantie">Type de garantie <span style="color:red">*</span></label>
                <input type="text" id="typeGarantie" name="typeGarantie" 
                       placeholder="Ex: Hypothèque, Nantissement..." required/>
            </div>
            
            <div class="form-group">
                <label for="valeurEstimee">Valeur estimée (DT)</label>
                <input type="number" step="0.001" id="valeurEstimee" name="valeurEstimee" 
                       placeholder="0.000"/>
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" 
                      placeholder="Description de la garantie (optionnel)"></textarea>
        </div>
        
        <div class="form-group">
            <label for="documentRef">Référence document</label>
            <input type="text" id="documentRef" name="documentRef" 
                   placeholder="Référence du document (optionnel)"/>
        </div>
        
        <button type="submit" class="btn btn-add">➕ Ajouter cette garantie</button>
    </form>
</div>

</body>
</html>
