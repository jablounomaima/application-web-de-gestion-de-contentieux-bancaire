<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} ?: 'Gérer les Clients'">Gérer les Clients</title>
</head>
<body>

<!-- En-tête -->
<header>
    <h1>Contentieux Bancaire</h1>
    <nav>
        <a th:href="@{/agent/dashboard}">Dashboard</a>
        <a th:href="@{/agent/clients}">Clients</a>
        <a th:href="@{/agent/prestataires}">Prestataires</a>
        <a th:href="@{/agent/missions}">Missions</a>
    </nav>
    <div>
        <span sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Déconnexion</button>
        </form>
    </div>
</header>

<!-- Messages flash -->
<div th:if="${success}" role="alert">
    <span th:text="${success}"></span>
</div>
<div th:if="${error}" role="alert">
    <span th:text="${error}"></span>
</div>

<!-- Contenu principal -->
<main>
    <h2 th:text="${pageTitle} ?: 'Gestion des Clients'">Gestion des Clients</h2>
    
   <!-- Bouton création -->
<button type="button" onclick="toggleForm()">+ Nouveau Client</button>

<div id="createForm" style="display: none;">
    <h3>Créer un nouveau client</h3>

    <form th:action="@{/agent/clients/creer}" method="post" th:object="${nouveauClient}">

        <!-- TYPE CLIENT -->
        <div>
            <label>Type Client :</label>
            <select th:field="*{typeClient}" onchange="toggleClientType(this.value)">
                <option th:each="t : ${T(com.example.contentieux_security.enums.TypeClient).values()}"
                        th:value="${t}"
                        th:text="${t}">
                </option>
            </select>
        </div>

        <!-- RAISON SOCIALE -->
        <div id="raisonDiv" style="display:none;">
            <label>Raison sociale :</label>
            <input type="text" th:field="*{raisonSociale}">
        </div>

        <div>
            <label>Nom :</label>
            <input type="text" th:field="*{nom}" required>
        </div>

        <div>
            <label>Prénom :</label>
            <input type="text" th:field="*{prenom}">
        </div>

        <!-- CIN -->
        <div id="cinDiv">
            <label>CIN :</label>
            <input type="text" th:field="*{cin}">
        </div>

        <!-- RNE -->
        <div id="rneDiv" style="display:none;">
            <label>RNE :</label>
            <input type="text" th:field="*{rne}">
        </div>

        <div>
            <label>Email :</label>
            <input type="email" th:field="*{email}">
        </div>

        <div>
            <label>Téléphone :</label>
            <input type="tel" th:field="*{telephone}">
        </div>

        <div>
            <label>Adresse :</label>
            <textarea th:field="*{adresse}"></textarea>
        </div>

        <div>
            <button type="submit">Enregistrer</button>
            <button type="button" onclick="toggleForm()">Annuler</button>
        </div>

    </form>
</div>
    
    <!-- Liste des clients -->
    <section>
        <h3>Liste des clients</h3>
        
        <div th:if="${#lists.isEmpty(clients)}">
            <p>Aucun client trouvé.</p>
        </div>
        
        <table th:if="${not #lists.isEmpty(clients)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>CIN</th>
                    <th>RNE</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Date inscription</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="client : ${clients}">
                    <td th:text="${client.id}"></td>
                    <td th:text="${client.nom}"></td>
                    <td th:text="${client.prenom}"></td>
                    <td th:text="${client.cin}"></td>
                    <td th:text="${client.rne}"></td>
                    <td th:text="${client.email}"></td>
                    <td th:text="${client.telephone}"></td>
                    <td th:text="${#temporals.format(client.dateInscription, 'dd/MM/yyyy')}"></td>
                    <td>
                        <a th:href="@{/agent/clients/{id}(id=${client.id})}">Voir</a>
                        <a th:href="@{/agent/clients/{id}/edit(id=${client.id})}">Modifier</a>
                        <a th:href="@{/agent/clients/{id}/dossiers(id=${client.id})}">Dossiers</a>
                        <form th:action="@{/agent/clients/{id}/delete(id=${client.id})}" method="post" style="display: inline;">
                            <button type="submit" onclick="return confirm('Confirmer la suppression ?')">Supprimer</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
    
    <!-- Recherche -->
    <section>
        <h3>Rechercher un client</h3>
        <form th:action="@{/agent/clients/rechercher}" method="get">
            <input type="text" name="keyword" placeholder="Nom, CIN, RNE, email...">            <button type="submit">Rechercher</button>
        </form>
    </section>
</main>

<!-- Pied de page -->
<footer>
    <p>&copy; 2024 Contentieux Bancaire</p>
</footer>

<!-- Script minimal -->
<script>
    function toggleForm() {
        const form = document.getElementById("createForm");
        form.style.display = (form.style.display === "none") ? "block" : "none";
    }
    
    function toggleClientType(value) {
    const cinDiv = document.getElementById("cinDiv");
    const rneDiv = document.getElementById("rneDiv");
    const raisonDiv = document.getElementById("raisonDiv");

    const cinInput = document.querySelector("[name='cin']");
    const rneInput = document.querySelector("[name='rne']");
    const raisonInput = document.querySelector("[name='raisonSociale']");

    if (value === "ENTREPRISE") {
        cinDiv.style.display = "none";
        rneDiv.style.display = "block";
        raisonDiv.style.display = "block";

        // 🔥 IMPORTANT
        cinInput.value = "";          // vider
        cinInput.readOnly = true;     // bloquer sans supprimer

        rneInput.readOnly = false;
        raisonInput.readOnly = false;

    } else {
        cinDiv.style.display = "block";
        rneDiv.style.display = "none";
        raisonDiv.style.display = "none";

        // 🔥 IMPORTANT
        rneInput.value = "";
        raisonInput.value = "";

        cinInput.readOnly = false;
        rneInput.readOnly = true;
        raisonInput.readOnly = true;
    }
}
    function toggleRaisonSociale(val) {
    const isEntreprise = val === 'ENTREPRISE';

    const raisonDiv = document.getElementById('raisonSocialeDiv');
    const rneDiv = document.getElementById('rneDiv');
    const cinDiv = document.getElementById('cinDiv');

    const raisonInput = document.querySelector("[name='clientRaisonSociale']");
    const rneInput = document.querySelector("[name='clientRne']");
    const cinInput = document.querySelector("[name='clientCin']");

    // 🎯 Affichage
    raisonDiv.style.display = isEntreprise ? 'flex' : 'none';
    rneDiv.style.display = isEntreprise ? 'flex' : 'none';
    cinDiv.style.display = isEntreprise ? 'none' : 'flex';

    // 🔥 TRÈS IMPORTANT → empêcher envoi
    raisonInput.disabled = !isEntreprise;
    rneInput.disabled = !isEntreprise;
    cinInput.disabled = isEntreprise;
}
    </script>

</body>
</html>
