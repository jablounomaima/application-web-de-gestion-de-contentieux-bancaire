<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lancer une procédure</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet"/>
</head>
<body>

<!-- ✅ REMPLACEZ cette ligne par le bon chemin de votre navbar -->
<!-- Exemples possibles selon votre projet :                    -->
<!--   th:replace="~{fragments/navbar :: navbar}"              -->
<!--   th:replace="~{agent/fragments/navbar :: navbar}"        -->
<!--   th:replace="~{layout :: navbar}"                        -->


<div class="container mt-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a th:href="@{/agent/dossiers}">Mes dossiers</a>
            </li>
            <li class="breadcrumb-item">
                <a th:href="@{/agent/dossiers/{id}(id=${dossier.id})}"
                   th:text="${dossier.numeroDossier}">DOS-XXX</a>
            </li>
            <li class="breadcrumb-item active">Lancer une procédure</li>
        </ol>
    </nav>

    <!-- Alertes flash -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Résumé dossier -->
    <div class="card border-success mb-4 shadow-sm">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <span>
                <i class="bi bi-folder-check me-2"></i>
                Dossier validé — <strong th:text="${dossier.numeroDossier}"></strong>
            </span>
            <span class="badge bg-light text-success fw-bold">VALIDE</span>
        </div>
        <div class="card-body row g-3">
            <div class="col-md-4">
                <small class="text-muted d-block">Client</small>
                <strong th:text="${dossier.client.nom + ' ' +
                    (dossier.client.prenom != null ? dossier.client.prenom : '')}">
                </strong>
            </div>
            <div class="col-md-4">
                <small class="text-muted d-block">Crédit sélectionné</small>
                <span th:each="r : ${dossier.risques}" th:if="${r.selectionne}">
                    <strong th:text="${r.type}"></strong>
                    — <span th:text="${#numbers.formatDecimal(r.montantImpaye, 1, 'COMMA', 2, 'POINT') + ' TND'}"></span>
                </span>
            </div>
            <div class="col-md-4">
                <small class="text-muted d-block">Agent créateur</small>
                <strong th:text="${dossier.agentCreateur.nom + ' ' + dossier.agentCreateur.prenom}">
                </strong>
            </div>
        </div>
    </div>

    <!-- Formulaire -->
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">
                <i class="bi bi-gavel me-2 text-danger"></i>
                Lancer la procédure judiciaire
            </h5>
        </div>
        <div class="card-body">
            <form th:action="@{/agent/dossiers/{id}/prestations/lancer(id=${dossier.id})}"
                  method="post">

                <!-- Type de procédure -->
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        Type de procédure <span class="text-danger">*</span>
                    </label>
                    <div class="d-flex gap-3 flex-wrap">
                        <div th:each="type : ${typesPrestations}"
                             class="form-check form-check-inline border rounded px-3 py-2">
                            <input class="form-check-input" type="radio"
                                   name="type"
                                   th:id="${'type_' + type.name()}"
                                   th:value="${type.name()}"
                                   th:checked="${typeStat == null ? type.name() == 'PROCEDURE_JUDICIAIRE' : false}"
                                   required/>
                            <label class="form-check-label ms-1"
                                   th:for="${'type_' + type.name()}"
                                   th:text="${type.getLibelle()}">
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label for="description" class="form-label fw-bold">
                        Description de la procédure
                    </label>
                    <textarea id="description"
                              name="description"
                              class="form-control"
                              rows="4"
                              placeholder="Ex : Procédure de recouvrement judiciaire suite à défaillance de paiement depuis le 01/01/2025...">
                    </textarea>
                </div>

    
                <!-- Boutons -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit"
                            class="btn btn-danger px-4"
                            >
                        <i class="bi bi-gavel me-2"></i>Lancer la procédure
                    </button>
                    <a th:href="@{/agent/dossiers/{id}(id=${dossier.id})}"
                       class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i>Annuler
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
