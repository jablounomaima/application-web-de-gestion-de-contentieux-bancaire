<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Changer mon mot de passe</title>

    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #f5f5f5; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display:block; margin-bottom:5px; }

        input {
            width:100%;
            padding:12px;
            border:2px solid #ddd;
            border-radius:5px;
        }

        .btn {
            width:100%;
            padding:12px;
            background:#667eea;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .alert { padding:12px; margin-bottom:20px; border-radius:5px; }
        .alert-error { background:#f8d7da; color:#721c24; }
        .alert-success { background:#d4edda; color:#155724; }

        .back-link {
            display:block;
            text-align:center;
            margin-top:20px;
        }
    </style>

    <!-- ✅ Validation JS -->
    <script>
        function validateForm() {
            const newPass = document.getElementById("newPassword").value;
            const confirmPass = document.getElementById("confirmPassword").value;

            if (newPass !== confirmPass) {
                alert("❌ Les mots de passe ne correspondent pas !");
                return false;
            }
            return true;
        }
    </script>
</head>

<body>
<div class="container">

    <h1>🔐 Changer mon mot de passe</h1>

    <!-- Messages -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/agent/change-password}" 
          method="post" 
          th:object="${passwordChange}"
          onsubmit="return validateForm()">

        <!-- ⚠️ CSRF seulement si activé -->
    

        <div class="form-group">
            <label>Mot de passe actuel</label>
            <input type="password" th:field="*{currentPassword}" required>
        </div>

        <div class="form-group">
            <label>Nouveau mot de passe</label>
            <input type="password" id="newPassword"
                   th:field="*{newPassword}"
                   required minlength="6">
        </div>

        <div class="form-group">
            <label>Confirmer</label>
            <input type="password" id="confirmPassword"
                   th:field="*{confirmPassword}"
                   required>
        </div>

        <button type="submit" class="btn">Changer</button>
    </form>

    <!-- ✅ Correction URL -->
    <a th:href="@{/agent/dashboard}" class="back-link">
        ← Retour au dashboard
    </a>

</div>
</body>
</html>
