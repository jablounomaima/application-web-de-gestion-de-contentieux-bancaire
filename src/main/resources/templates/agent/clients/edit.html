<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Modifier le client</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; color: #333; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        nav a { margin-right: 12px; text-decoration: none; color: #3498db; }
        h2 { margin-bottom: 20px; }
        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; max-width: 600px; }
        .alert-success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .alert-error   { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
        .card { background: white; padding: 28px; border-radius: 6px; max-width: 600px;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #555;
                margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
        input[type=text], input[type=email], input[type=tel], select, textarea {
            width: 100%; padding: 9px 12px; border: 1.5px solid #e2e8f0;
            border-radius: 6px; font-size: 13.5px; background: white;
            color: #333; outline: none; font-family: Arial, sans-serif; }
        input:focus, select:focus, textarea:focus {
            border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,.1); }
        textarea { resize: vertical; min-height: 70px; }
        .actions { display: flex; gap: 10px; margin-top: 22px; }
        .btn { padding: 10px 20px; border-radius: 4px; font-size: 14px;
               cursor: pointer; border: none; text-decoration: none;
               display: inline-block; font-family: Arial, sans-serif; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-secondary { background: #777; color: white; }
        .btn-secondary:hover { background: #555; }
        .hidden { display: none !important; }
        .badge-PARTICULIER { background:#cce5ff; color:#004085; padding:3px 10px;
                             border-radius:12px; font-size:12px; font-weight:bold; }
        .badge-ENTREPRISE  { background:#d4edda; color:#155724; padding:3px 10px;
                             border-radius:12px; font-size:12px; font-weight:bold; }
    </style>
</head>
<body>

<!-- EN-TÊTE -->
<header>
    <h1>Contentieux Bancaire</h1>
    <nav>
        <a th:href="@{/agent/dashboard}">Dashboard</a>
        <a th:href="@{/agent/clients}">Clients</a>
        <a th:href="@{/agent/prestataires}">Prestataires</a>
        <a th:href="@{/agent/missions}">Missions</a>
    </nav>
    <div>
        <span sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-secondary" style="padding:6px 12px;font-size:13px;">
                Déconnexion
            </button>
        </form>
    </div>
</header>

<!-- ALERTES -->
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

<!-- TITRE -->
<h2>
    ✏️ Modifier le client —
    <span th:text="${client.nom + ' ' + (client.prenom ?: '')}"></span>
    <span class="badge-PARTICULIER"
          th:if="${client.typeClient != null and client.typeClient.name() == 'PARTICULIER'}">
        Particulier
    </span>
    <span class="badge-ENTREPRISE"
          th:if="${client.typeClient != null and client.typeClient.name() == 'ENTREPRISE'}">
        Entreprise
    </span>
</h2>

<!-- FORMULAIRE -->
<div class="card">
    <form th:action="@{/agent/clients/{id}/edit(id=${client.id})}"
          method="post"
          th:object="${client}">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- TYPE CLIENT -->
        <div class="form-group">
            <label>Type de client</label>
            <select th:field="*{typeClient}" onchange="toggleType(this.value)">
                <option th:each="t : ${T(com.example.contentieux_security.enums.TypeClient).values()}"
                        th:value="${t}"
                        th:text="${t}">
                </option>
            </select>
        </div>

        <!-- RAISON SOCIALE (Entreprise) -->
        <div class="form-group" id="raisonDiv"
             th:classappend="${client.typeClient != null and client.typeClient.name() == 'ENTREPRISE'} ? '' : 'hidden'">
            <label>Raison sociale</label>
            <input type="text" th:field="*{raisonSociale}" placeholder="Nom de l'entreprise"/>
        </div>

        <!-- NOM -->
        <div class="form-group">
            <label>Nom <span style="color:red">*</span></label>
            <input type="text" th:field="*{nom}" required placeholder="Ben Salem"/>
        </div>

        <!-- PRÉNOM -->
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" th:field="*{prenom}" placeholder="Ahmed"/>
        </div>

        <!-- CIN (Particulier) -->
        <div class="form-group" id="cinDiv"
             th:classappend="${client.typeClient != null and client.typeClient.name() == 'ENTREPRISE'} ? 'hidden' : ''">
            <label>CIN</label>
            <input type="text" th:field="*{cin}" placeholder="12345678" maxlength="8"/>
        </div>

        <!-- RNE (Entreprise) -->
        <div class="form-group" id="rneDiv"
             th:classappend="${client.typeClient != null and client.typeClient.name() == 'ENTREPRISE'} ? '' : 'hidden'">
            <label>RNE</label>
            <input type="text" th:field="*{rne}" placeholder="1234567A"/>
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="client@email.com"/>
        </div>

        <!-- TÉLÉPHONE -->
        <div class="form-group">
            <label>Téléphone</label>
            <input type="tel" th:field="*{telephone}" placeholder="+216 XX XXX XXX"/>
        </div>

        <!-- ADRESSE -->
        <div class="form-group">
            <label>Adresse</label>
            <textarea th:field="*{adresse}" placeholder="12 Rue..."></textarea>
        </div>

        <!-- ACTIONS -->
        <div class="actions">
            <button type="submit" class="btn btn-primary">💾 Enregistrer les modifications</button>
            <a th:href="@{/agent/clients}" class="btn btn-secondary">✕ Annuler</a>
        </div>

    </form>
</div>

<footer style="margin-top:40px;color:#aaa;font-size:13px;">
    <p>&copy; 2024 Contentieux Bancaire</p>
</footer>

<script>
function toggleType(value) {
    const isEntreprise = value === 'ENTREPRISE';

    document.getElementById('raisonDiv').classList.toggle('hidden', !isEntreprise);
    document.getElementById('rneDiv').classList.toggle('hidden', !isEntreprise);
    document.getElementById('cinDiv').classList.toggle('hidden', isEntreprise);

    const cinInput    = document.querySelector("[name='cin']");
    const rneInput    = document.querySelector("[name='rne']");
    const raisonInput = document.querySelector("[name='raisonSociale']");

    if (isEntreprise) {
        if (cinInput)    { cinInput.value = '';    cinInput.disabled = true; }
        if (rneInput)    rneInput.disabled = false;
        if (raisonInput) raisonInput.disabled = false;
    } else {
        if (rneInput)    { rneInput.value = '';    rneInput.disabled = true; }
        if (raisonInput) { raisonInput.value = ''; raisonInput.disabled = true; }
        if (cinInput)    cinInput.disabled = false;
    }
}

// Init au chargement
window.addEventListener('DOMContentLoaded', () => {
    const select = document.querySelector("[name='typeClient']");
    if (select) toggleType(select.value);
});
</script>

</body>
</html>
