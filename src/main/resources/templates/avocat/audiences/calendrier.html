<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Calendrier des audiences</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css"/>
    <style>
        body { background:#f0f2f8; font-family:'Segoe UI',sans-serif; }
        .card { border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .fc-event {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .fc-event:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 py-2">
    <a class="navbar-brand fw-bold" href="/avocat/dashboard">
        <i class="bi bi-gavel me-2"></i>Cabinet — Avocat
    </a>
    <div class="ms-auto d-flex gap-3">
        <a href="/avocat/dashboard" class="text-white-50">Dashboard</a>
        <a href="/avocat/affaires" class="text-white-50">Mes affaires</a>
        <a href="/avocat/audiences" class="text-white">Audiences</a>
        <a href="/avocat/audiences/calendrier" class="text-white-50">Calendrier</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Déconnexion</a>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-calendar-week me-2"></i>Calendrier des audiences</h2>
            <p class="text-muted">Visualisation mensuelle de vos audiences</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAudienceModal">
            <i class="bi bi-plus-circle me-1"></i>Nouvelle audience
        </button>
    </div>

    <div class="card p-3">
        <div id="calendar"></div>
    </div>
</div>

<!-- Modal Détail Audience -->
<div class="modal fade" id="audienceDetailModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Détail de l'audience</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="audienceDetailBody">
                <p>Chargement...</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                <a href="#" id="audienceDetailLink" class="btn btn-primary">Voir l'affaire</a>
            </div>
        </div>
    </div>
</div>

<!-- Modal Ajouter Audience (similaire à la page liste) -->
<div class="modal fade" id="addAudienceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/avocat/audiences/ajouter}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Nouvelle audience</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Affaire *</label>
                        <select name="affaireId" class="form-select" required>
                            <option value="">Sélectionner une affaire</option>
                            <option th:each="affaire : ${affaires}" th:value="${affaire.id}" th:text="${affaire.numeroAffaire + ' - ' + affaire.tribunal}"></option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Date *</label>
                            <input type="date" name="dateAudience" class="form-control" required/>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Heure</label>
                            <input type="time" name="heure" class="form-control"/>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Salle</label>
                            <input type="text" name="salle" class="form-control" placeholder="Salle"/>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label">Motif</label>
                            <input type="text" name="motif" class="form-control" placeholder="Motif"/>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Observations</label>
                        <textarea name="observations" class="form-control" rows="2" placeholder="Observations"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary">Planifier</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/fr.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            locale: 'fr',
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listWeek'
            },
            events: function(fetchInfo, successCallback, failureCallback) {
                fetch('/avocat/audiences/api/evenements')
                    .then(response => response.json())
                    .then(data => {
                        const events = data.map(a => ({
                            id: a.id,
                            title: a.affaire.tribunal + ' - ' + a.motif,
                            start: a.dateAudience + (a.heure ? 'T' + a.heure : ''),
                            backgroundColor: a.statut === 'TENUE' ? '#198754' : 
                                           (a.statut === 'REPORTEE' ? '#ffc107' :
                                           (a.statut === 'ANNULEE' ? '#dc3545' : '#0d6efd')),
                            extendedProps: {
                                affaireId: a.affaire.id,
                                numeroAffaire: a.affaire.numeroAffaire,
                                salle: a.salle,
                                motif: a.motif,
                                resultat: a.resultat,
                                statut: a.statut
                            }
                        }));
                        successCallback(events);
                    })
                    .catch(error => failureCallback(error));
            },
            eventClick: function(info) {
                const props = info.event.extendedProps;
                document.getElementById('audienceDetailBody').innerHTML = `
                    <div class="mb-2">
                        <strong>Affaire :</strong> ${props.numeroAffaire}
                    </div>
                    <div class="mb-2">
                        <strong>Tribunal :</strong> ${info.event.title.split(' - ')[0]}
                    </div>
                    <div class="mb-2">
                        <strong>Date :</strong> ${info.event.start.toLocaleDateString('fr-FR')}
                    </div>
                    <div class="mb-2">
                        <strong>Salle :</strong> ${props.salle || '-'}
                    </div>
                    <div class="mb-2">
                        <strong>Motif :</strong> ${props.motif || '-'}
                    </div>
                    <div class="mb-2">
                        <strong>Statut :</strong> 
                        <span class="badge">${props.statut}</span>
                    </div>
                    <div class="mb-2">
                        <strong>Compte-rendu :</strong> ${props.resultat || 'Non renseigné'}
                    </div>
                `;
                document.getElementById('audienceDetailLink').href = `/avocat/affaires/${props.affaireId}`;
                new bootstrap.Modal(document.getElementById('audienceDetailModal')).show();
            }
        });
        calendar.render();
    });
</script>
</body>
</html>
