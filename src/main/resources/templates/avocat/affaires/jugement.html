<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title>Saisir le jugement</title>
</head>

<body>
<div layout:fragment="content" class="container py-4">

    <!-- ── En-tête ───────────────────────────────────────── -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">
                <i class="bi bi-file-earmark-ruled me-2"></i>Saisir le jugement
            </h2>
            <small class="text-muted"
                   th:text="'Affaire ' + ${affaire.numeroAffaire} + ' · ' + ${affaire.tribunal}">
            </small>
        </div>
        <a th:href="@{/avocat/affaires/{id}(id=${affaire.id})}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Retour à l'affaire
        </a>
    </div>

    <!-- ── Alertes flash ──────────────────────────────────── -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ── Jugement déjà saisi → affichage en lecture ────── -->
    <div th:if="${affaire.typeJugement != null}" class="card shadow-sm mb-4 border-success">
        <div class="card-header bg-success-subtle text-success fw-semibold">
            <i class="bi bi-check2-circle me-1"></i>Jugement enregistré
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="small text-muted">Type</div>
                    <div th:switch="${affaire.typeJugement.name()}">
                        <span th:case="'FAVORABLE'"   class="badge bg-success fs-6">Favorable</span>
                        <span th:case="'DEFAVORABLE'" class="badge bg-danger fs-6">Défavorable</span>
                        <span th:case="'EN_APPEL'"    class="badge bg-warning text-dark fs-6">En appel</span>
                        <span th:case="'TRANSACTION'" class="badge bg-info text-dark fs-6">Transaction</span>
                        <span th:case="'EN_ATTENTE'"  class="badge bg-secondary fs-6">En attente</span>
                        <span th:case="*"             class="badge bg-secondary fs-6" th:text="${affaire.typeJugement}"></span>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="small text-muted">Date</div>
                    <div th:text="${affaire.dateJugement != null ? #temporals.format(affaire.dateJugement,'dd/MM/yyyy') : '—'}"></div>
                </div>
                <div class="col-md-3">
                    <div class="small text-muted">Montant jugé</div>
                    <div th:text="${affaire.montantJuge ?: '—'}"></div>
                </div>
                <div class="col-md-3">
                    <div class="small text-muted">Délai paiement</div>
                    <div th:text="${affaire.delaiPaiementJuge ?: '—'}"></div>
                </div>
                <div class="col-12" th:if="${affaire.descriptionJugement}">
                    <div class="small text-muted">Description</div>
                    <div th:text="${affaire.descriptionJugement}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Formulaire de saisie ────────────────────────────── -->
    <div class="card shadow-sm">
        <div class="card-header fw-semibold">
            <i class="bi bi-pencil-square me-1"></i>
            <span th:text="${affaire.typeJugement != null ? 'Modifier le jugement' : 'Renseigner le jugement'}"></span>
        </div>
        <div class="card-body">

            <form th:action="@{/avocat/affaires/{id}/jugement(id=${affaire.id})}"
                  method="post">

                <div class="row g-3">

                    <!-- Type de jugement -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Type de jugement <span class="text-danger">*</span>
                        </label>
                        <div class="d-flex flex-wrap gap-2">
                            <div th:each="t : ${typesJugement}"
                                 class="form-check form-check-inline border rounded px-3 py-2">
                                <input class="form-check-input" type="radio"
                                       name="typeJugement"
                                       th:id="'type_' + ${t}"
                                       th:value="${t}"
                                       th:checked="${affaire.typeJugement == t}"
                                       required>
                                <label class="form-check-label"
                                       th:for="'type_' + ${t}"
                                       th:text="${t}">
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Date du jugement -->
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">
                            Date du jugement <span class="text-danger">*</span>
                        </label>
                        <input type="date" name="dateJugement"
                               class="form-control"
                               th:value="${affaire.dateJugement}"
                               required>
                    </div>

                    <!-- Montant jugé -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Montant jugé</label>
                        <input type="text" name="montantJuge"
                               class="form-control"
                               placeholder="Ex : 15 000 DT"
                               th:value="${affaire.montantJuge}">
                        <div class="form-text">Montant alloué par le tribunal</div>
                    </div>

                    <!-- Délai paiement -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Délai de paiement</label>
                        <input type="text" name="delaiPaiementJuge"
                               class="form-control"
                               placeholder="Ex : 30 jours"
                               th:value="${affaire.delaiPaiementJuge}">
                    </div>

                    <!-- Description -->
                    <div class="col-12">
                        <label class="form-label fw-semibold">Description / Dispositif</label>
                        <textarea name="descriptionJugement"
                                  class="form-control" rows="5"
                                  placeholder="Résumé du dispositif du jugement, conditions, observations..."
                                  th:text="${affaire.descriptionJugement}"></textarea>
                    </div>

                </div><!-- /row -->

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy me-1"></i>Enregistrer
                    </button>
                    <a th:href="@{/avocat/affaires/{id}(id=${affaire.id})}"
                       class="btn btn-outline-secondary">
                        Annuler
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>
</body>
</html>
