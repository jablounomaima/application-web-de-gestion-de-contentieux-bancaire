<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title>Audiences — Affaire</title>
</head>

<body>
<div layout:fragment="content" class="container py-4">

    <!-- ── En-tête ───────────────────────────────────────── -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">
                <i class="bi bi-calendar2-event me-2"></i>Audiences
            </h2>
            <small class="text-muted"
                   th:text="'Affaire ' + ${affaire.numeroAffaire} + ' · ' + ${affaire.tribunal}">
            </small>
        </div>
        <a th:href="@{/avocat/affaires/{id}(id=${affaire.id})}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Retour à l'affaire
        </a>
    </div>

    <!-- ── Alertes flash ──────────────────────────────────── -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- ── Colonne gauche : liste des audiences ────────── -->
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">
                        <i class="bi bi-list-ul me-1"></i>
                        Historique
                        (<span th:text="${audiences.size()}">0</span>)
                    </span>
                </div>
                <div class="card-body p-0">

                    <!-- Aucune audience -->
                    <div th:if="${#lists.isEmpty(audiences)}"
                         class="text-center text-muted py-5">
                        <i class="bi bi-calendar-x fs-2 d-block mb-2"></i>
                        Aucune audience enregistrée
                    </div>

                    <!-- Liste des audiences -->
                    <div th:unless="${#lists.isEmpty(audiences)}"
                         class="list-group list-group-flush">

                        <div th:each="aud : ${audiences}"
                             class="list-group-item py-3">

                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <!-- Date + heure -->
                                    <div class="fw-semibold">
                                        <i class="bi bi-calendar3 me-1 text-primary"></i>
                                        <span th:text="${#temporals.format(aud.dateAudience,'dd/MM/yyyy')}"></span>
                                        <span th:if="${aud.heure}"
                                              class="text-muted ms-1"
                                              th:text="'à ' + ${aud.heure}"></span>
                                    </div>
                                    <!-- Salle + motif -->
                                    <div class="small text-muted mt-1">
                                        <span th:if="${aud.salle}">
                                            <i class="bi bi-geo-alt me-1"></i>
                                            <span th:text="${aud.salle}"></span> ·
                                        </span>
                                        <span th:text="${aud.motif ?: 'Motif non précisé'}"></span>
                                    </div>
                                    <!-- Résultat -->
                                    <div th:if="${aud.resultat}"
                                         class="small mt-1 fst-italic"
                                         th:text="${aud.resultat}"></div>
                                    <!-- Prochaine audience -->
                                    <div th:if="${aud.prochaineAudience}"
                                         class="small mt-1">
                                        <i class="bi bi-arrow-right-circle text-info me-1"></i>
                                        Prochaine :
                                        <span th:text="${#temporals.format(aud.prochaineAudience,'dd/MM/yyyy')}"></span>
                                    </div>
                                </div>

                                <!-- Badge statut -->
                                <div class="ms-3">
                                    <span th:switch="${aud.statut.name()}">
                                        <span th:case="'PLANIFIEE'"   class="badge bg-primary">Planifiée</span>
                                        <span th:case="'TENUE'"       class="badge bg-success">Tenue</span>
                                        <span th:case="'RENVOYEE'"    class="badge bg-warning text-dark">Renvoyée</span>
                                        <span th:case="'ANNULEE'"     class="badge bg-danger">Annulée</span>
                                        <span th:case="*"             class="badge bg-secondary" th:text="${aud.statut}"></span>
                                    </span>
                                </div>
                            </div>

                            <!-- Bouton modifier statut (collapse) -->
                            <div class="mt-2">
                                <button class="btn btn-outline-secondary btn-sm"
                                        type="button"
                                        data-bs-toggle="collapse"
                                        th:data-bs-target="'#update-' + ${aud.id}">
                                    <i class="bi bi-pencil me-1"></i>Modifier le statut
                                </button>

                                <div class="collapse mt-2" th:id="'update-' + ${aud.id}">
                                    <form th:action="@{/avocat/affaires/{aid}/audiences/{uid}/statut(aid=${affaire.id},uid=${aud.id})}"
                                          method="post" class="border rounded p-3 bg-light">
                                        <div class="row g-2">
                                            <div class="col-sm-4">
                                                <label class="form-label small">Statut</label>
                                                <select name="statut" class="form-select form-select-sm" required>
                                                    <option th:each="s : ${statutsAudience}"
                                                            th:value="${s}"
                                                            th:text="${s}"
                                                            th:selected="${s == aud.statut}">
                                                    </option>
                                                </select>
                                            </div>
                                            <div class="col-sm-4">
                                                <label class="form-label small">Prochaine audience</label>
                                                <input type="date" name="prochaineAudience"
                                                       class="form-control form-control-sm"
                                                       th:value="${aud.prochaineAudience}">
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label small">Résultat</label>
                                                <textarea name="resultat" class="form-control form-control-sm"
                                                          rows="2"
                                                          th:text="${aud.resultat}"></textarea>
                                            </div>
                                            <div class="col-12">
                                                <button class="btn btn-primary btn-sm" type="submit">
                                                    <i class="bi bi-check-lg me-1"></i>Enregistrer
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>

                        </div><!-- /list-group-item -->
                    </div><!-- /list-group -->
                </div><!-- /card-body -->
            </div><!-- /card -->
        </div><!-- /col-lg-7 -->

        <!-- ── Colonne droite : formulaire ajout ──────────── -->
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">
                    <i class="bi bi-plus-circle me-1"></i>Ajouter une audience
                </div>
                <div class="card-body">
                    <form th:action="@{/avocat/affaires/{id}/audiences(id=${affaire.id})}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">Date <span class="text-danger">*</span></label>
                            <input type="date" name="dateAudience"
                                   class="form-control" required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Heure</label>
                                <input type="time" name="heure" class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Salle</label>
                                <input type="text" name="salle"
                                       class="form-control" placeholder="Ex : Salle 3">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Motif</label>
                            <input type="text" name="motif" class="form-control"
                                   placeholder="Ex : Plaidoirie, Renvoi...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Résultat / Observations</label>
                            <textarea name="resultat" class="form-control" rows="3"
                                      placeholder="Compte-rendu de l'audience..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Prochaine audience</label>
                            <input type="date" name="prochaineAudience" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Statut <span class="text-danger">*</span></label>
                            <select name="statut" class="form-select" required>
                                <option th:each="s : ${statutsAudience}"
                                        th:value="${s}"
                                        th:text="${s}">
                                </option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-calendar-plus me-1"></i>Ajouter
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div><!-- /col-lg-5 -->

    </div><!-- /row -->
</div>
</body>
</html>
