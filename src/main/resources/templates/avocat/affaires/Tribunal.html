<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Tribunal — Affaire</title>
</head>
<body>
<div layout:fragment="content" class="container py-4">

    <!-- ── En-tête ───────────────────────────────────────── -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">
                <i class="bi bi-bank me-2"></i>Informations du tribunal
            </h2>
            <small class="text-muted"
                   th:text="'Affaire ' + ${affaire.numeroAffaire}"></small>
        </div>
        <a th:href="@{/avocat/affaires/{id}(id=${affaire.id})}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Retour à l'affaire
        </a>
    </div>

    <!-- ── Alertes flash ──────────────────────────────────── -->
    <div th:if="${successMsg}"
         class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}"
         class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- ══════════════════════════════════════════════════
             COLONNE GAUCHE — valeurs actuelles + supprimer
             ══════════════════════════════════════════════════ -->
        <div class="col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-semibold d-flex
                            justify-content-between align-items-center">
                    <span>
                        <i class="bi bi-info-circle me-1"></i>Valeurs actuelles
                    </span>
                    <!-- Supprimer (si au moins un champ renseigné) -->
                    <form th:if="${affaire.tribunal != null
                                  or affaire.chambre != null
                                  or affaire.numeroRole != null}"
                          th:action="@{/avocat/affaires/{id}/tribunal/supprimer(
                                      id=${affaire.id})}"
                          method="post"
                          onsubmit="return confirm('Effacer les informations du tribunal ?')">
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-trash me-1"></i>Effacer
                        </button>
                    </form>
                </div>
                <div class="card-body">

                    <div class="mb-3">
                        <div class="small text-muted mb-1">Tribunal</div>
                        <div class="fw-medium"
                             th:text="${affaire.tribunal ?: '—'}"></div>
                    </div>
                    <hr class="my-2">
                    <div class="mb-3">
                        <div class="small text-muted mb-1">Chambre</div>
                        <div th:text="${affaire.chambre ?: '—'}"></div>
                    </div>
                    <hr class="my-2">
                    <div class="mb-3">
                        <div class="small text-muted mb-1">N° de rôle</div>
                        <div th:text="${affaire.numeroRole ?: '—'}"></div>
                    </div>
                    <hr class="my-2">
                    <div>
                        <div class="small text-muted mb-1">Statut affaire</div>
                        <span th:switch="${affaire.statut?.name()}">
                            <span th:case="'EN_COURS'"
                                  class="badge bg-primary">En cours</span>
                            <span th:case="'JUGEMENT_RENDU'"
                                  class="badge bg-success">Jugement rendu</span>
                            <span th:case="'EXECUTION_FORCEE'"
                                  class="badge bg-danger">Exécution forcée</span>
                            <span th:case="'TRANSACTION'"
                                  class="badge bg-info text-dark">Transaction</span>
                            <span th:case="'CLOSE'"
                                  class="badge bg-secondary">Clôturée</span>
                            <span th:case="*"
                                  class="badge bg-light text-dark"
                                  th:text="${affaire.statut}"></span>
                        </span>
                    </div>

                </div>
            </div>
        </div>

        <!-- ══════════════════════════════════════════════════
             COLONNE DROITE — formulaire modifier
             ══════════════════════════════════════════════════ -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">
                    <i class="bi bi-pencil-square me-1"></i>
                    Modifier les informations du tribunal
                </div>
                <div class="card-body">
                    <form th:action="@{/avocat/affaires/{id}/tribunal(
                                      id=${affaire.id})}"
                          method="post">

                        <!-- Tribunal -->
                        <div class="mb-4">
                            <label for="tribunal" class="form-label fw-semibold">
                                Nom du tribunal
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-bank"></i>
                                </span>
                                <input type="text"
                                       id="tribunal"
                                       name="tribunal"
                                       class="form-control"
                                       placeholder="Ex : Tribunal de Première Instance de Tunis"
                                       th:value="${affaire.tribunal}">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <!-- Chambre -->
                            <div class="col-md-6">
                                <label for="chambre" class="form-label fw-semibold">
                                    Chambre
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-door-open"></i>
                                    </span>
                                    <input type="text"
                                           id="chambre"
                                           name="chambre"
                                           class="form-control"
                                           placeholder="Ex : Chambre civile"
                                           th:value="${affaire.chambre}">
                                </div>
                            </div>
                            <!-- N° rôle -->
                            <div class="col-md-6">
                                <label for="numeroRole" class="form-label fw-semibold">
                                    Numéro de rôle
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-hash"></i>
                                    </span>
                                    <input type="text"
                                           id="numeroRole"
                                           name="numeroRole"
                                           class="form-control"
                                           placeholder="Ex : 12345/2025"
                                           th:value="${affaire.numeroRole}">
                                </div>
                            </div>
                        </div>

                        <!-- Récap lecture seule -->
                        <div class="alert alert-light border mb-4">
                            <div class="small text-muted mb-1">
                                <i class="bi bi-lock me-1"></i>
                                Champs non modifiables
                            </div>
                            <div class="row g-2 mt-1">
                                <div class="col-sm-4">
                                    <span class="small text-muted">N° affaire :</span>
                                    <span class="fw-medium ms-1"
                                          th:text="${affaire.numeroAffaire}"></span>
                                </div>
                                <div class="col-sm-4">
                                    <span class="small text-muted">Date lancement :</span>
                                    <span class="fw-medium ms-1"
                                          th:text="${affaire.dateLancement != null
                                                    ? #temporals.format(
                                                      affaire.dateLancement,'dd/MM/yyyy')
                                                    : '—'}"></span>
                                </div>
                                <div class="col-sm-4">
                                    <span class="small text-muted">Dossier :</span>
                                    <span class="fw-medium ms-1"
                                          th:text="${affaire.dossier?.numeroDossier ?: '—'}">
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Boutons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-floppy me-1"></i>Enregistrer
                            </button>
                            <a th:href="@{/avocat/affaires/{id}(id=${affaire.id})}"
                               class="btn btn-outline-secondary">
                                Annuler
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div><!-- /row -->
</div>
</body>
</html>
