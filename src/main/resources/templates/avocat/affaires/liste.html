<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mes Affaires Judiciaires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<main class="container mt-5">
    <div class="page-header mb-4">
        <h2 class="fw-semibold">
            <i class="bi bi-briefcase-fill text-primary me-2"></i>Mes Affaires Judiciaires
        </h2>
        <p class="text-muted mb-0">Liste des affaires qui vous ont été assignées</p>
    </div>

    <div th:if="${#lists.isEmpty(affaires)}" class="alert alert-info d-flex align-items-center gap-2">
        <i class="bi bi-info-circle-fill"></i>
        <span>Aucune affaire judiciaire ne vous a été assignée pour le moment.</span>
    </div>

    <div th:unless="${#lists.isEmpty(affaires)}" class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">N° Affaire</th>
                        <th>Dossier</th>
                        <th>Tribunal</th>
                        <th>Date Lancement</th>
                        <th>Prochaine Audience</th>
                        <th>Statut</th>
                        <th class="pe-3 text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="affaire : ${affaires}">
                        <td class="ps-3">
                            <span class="fw-bold text-primary" th:text="${affaire.numeroAffaire}">AFF-2025</span>
                        </td>
                        <td>
                            <span th:if="${affaire.dossier != null}"
                                  th:text="${affaire.dossier?.numeroDossier}"
                                  class="fw-medium text-dark"></span>
                            <span th:unless="${affaire.dossier != null}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span th:text="${affaire.tribunal ?: '—'}">Tribunal</span>
                            <small th:if="${affaire.chambre != null}" class="d-block text-muted"
                                   th:text="${'Chambre : ' + affaire.chambre}"></small>
                        </td>
                        <td th:text="${affaire.dateLancement != null ? #temporals.format(affaire.dateLancement, 'dd/MM/yyyy') : '—'}"></td>
                        <td>
                            <span th:if="${affaire.dateProchainAudience != null}" class="badge bg-warning text-dark"
                                  th:text="${#temporals.format(affaire.dateProchainAudience, 'dd/MM/yyyy')}"></span>
                            <span th:unless="${affaire.dateProchainAudience != null}" class="text-muted">—</span>
                        </td>
                        <td>
                            <div th:switch="${affaire.statut?.name()}">
                                <span th:case="'EN_COURS'" class="badge bg-primary">En cours</span>
                                <span th:case="'JUGEMENT_RENDU'" class="badge bg-success">Jugement rendu</span>
                                <span th:case="'CLOTUREE'" class="badge bg-secondary">Clôturée</span>
                                <span th:case="'SUSPENDUE'" class="badge bg-warning text-dark">Suspendue</span>
                                <span th:case="*" class="badge bg-light text-dark" th:text="${affaire.statut}">—</span>
                            </div>
                        </td>
                        <td class="pe-3 text-end">
                            <div class="d-inline-flex gap-1">

                                <!-- Voir le détail -->
                                <a th:href="@{/avocat/affaires/{id}(id=${affaire.id})}"
                                   class="btn btn-sm btn-outline-primary"
                                   title="Voir le détail">
                                    <i class="bi bi-eye"></i>
                                </a>

                                <!-- Gérer les audiences -->
                                <a th:href="@{/avocat/affaires/{id}/audiences(id=${affaire.id})}"
                                   class="btn btn-sm btn-outline-info"
                                   title="Gérer les audiences">
                                    <i class="bi bi-calendar2-event"></i>
                                </a>

                                <!-- Gérer le tribunal -->
                                <a th:href="@{/avocat/affaires/{id}/tribunal(id=${affaire.id})}"
                                   class="btn btn-sm btn-outline-warning"
                                   title="Gérer le tribunal">
                                    <i class="bi bi-bank"></i>
                                </a>

                                <!-- Saisir / modifier le jugement -->
                                <a th:href="@{/avocat/affaires/{id}/jugement(id=${affaire.id})}"
                                   class="btn btn-sm btn-outline-success"
                                   title="Saisir le jugement">
                                    <i class="bi bi-file-earmark-ruled"></i>
                                </a>

                                <a th:href="@{/avocat/affaires/{id}/dossier(id=${affaire.id})}"
   class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-folder2-open me-1"></i>Voir dossier
</a>

                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
