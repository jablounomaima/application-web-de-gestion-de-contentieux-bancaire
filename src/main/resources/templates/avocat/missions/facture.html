<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Facture d'honoraires - BNA</title>
</head>
<body>
<div layout:fragment="content" class="container py-4">

    <!-- ── En-tête (الراس) ───────────────────────────────────────────── -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">
                <i class="bi bi-receipt me-2 text-primary"></i>Facture d'honoraires
            </h2>
            <small class="text-muted">
                Mission N° : <span th:text="${mission.numeroMission}"></span> 
                (Affaire : <span th:text="${affaire.numeroAffaire}"></span>)
            </small>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/avocat/affaires/{aId}/missions/{mId}/pv(aId=${affaire.id}, mId=${mission.id})}"
               class="btn btn-outline-info btn-sm">
                <i class="bi bi-file-text me-1"></i>Voir PV
            </a>
            <a th:href="@{/avocat/affaires/{id}(id=${affaire.id})}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Retour à l'affaire
            </a>
        </div>
    </div>

    <!-- ── Alertes ─────────────────────────────────────────────────────── -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show shadow-sm">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-warning alert-dismissible fade show shadow-sm">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- ── Colonne gauche ───────────────────────────────────────────── -->
        <div class="col-lg-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header fw-semibold bg-light">
                    <i class="bi bi-info-circle me-1"></i>Détails Mission
                </div>
                <div class="card-body">
                    <dl class="row mb-0 small">
                        <dt class="col-sm-6 text-muted fw-normal">Statut actuel</dt>
                        <dd class="col-sm-6">
                            <span th:switch="${mission.statut.name()}">
                                <span th:case="'PV_SOUMIS'" class="badge bg-success">PV soumis</span>
                                <span th:case="'FACTURE_SOUMISE'" class="badge bg-info text-dark">Facture soumise</span>
                                <span th:case="'TERMINEE'" class="badge bg-secondary">Terminée</span>
                                <span th:case="*" class="badge bg-light text-dark" th:text="${mission.statut}"></span>
                            </span>
                        </dd>

                        <dt class="col-sm-6 text-muted fw-normal">N° Dossier</dt>
                        <dd class="col-sm-6 fw-semibold" th:text="${mission.prestation?.dossier?.numeroDossier ?: '—'}"></dd>
                    </dl>
                </div>
            </div>

            <div class="card shadow-sm border-success" th:if="${mission.pvMission != null}">
                <div class="card-header bg-success-subtle text-success fw-semibold small">
                    <i class="bi bi-check2-circle me-1"></i>Contenu du PV validé
                </div>
                <div class="card-body">
                    <p class="small text-muted mb-0" style="white-space:pre-wrap; max-height:150px; overflow-y:auto;"
                       th:text="${mission.pvMission}"></p>
                </div>
            </div>
        </div>

        <!-- ── Colonne droite ───────────────────────────────────────────── -->
        <div class="col-lg-8">

            <!-- ── بطاقة الفاتورة المقدمة (مع أزرار تعديل وحذف) ────────────────── -->
            <!-- هاد القسم يظهر فقط كان statut == 'FACTURE_SOUMISE' (الفاتورة مقدمة بالفعل) -->
            <div th:if="${mission.statut.name() == 'FACTURE_SOUMISE'}"
                 class="card shadow-sm border-info mb-4">
                <div class="card-header bg-info-subtle text-info fw-semibold
                            d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-lock-fill me-1"></i>Facture transmise</span>
                    <div class="d-flex gap-2">
                        <!-- زرار تعديل الفاتورة (يوسع الفورمulaire) -->
                        <button class="btn btn-sm btn-outline-warning"
                                data-bs-toggle="collapse"
                                data-bs-target="#formModifierFacture">
                            <i class="bi bi-pencil me-1"></i>Modifier
                        </button>

                        <!-- زرار حذف الفاتورة -->
                        <form th:action="@{/avocat/affaires/{aId}/missions/{mId}/facture/supprimer(
                                          aId=${affaire.id},mId=${mission.id})}"
                              method="post"
                              onsubmit="return confirm('Supprimer la facture ? Le statut reviendra à PV_SOUMIS.')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Supprimer
                            </button>
                        </form>
                    </div>
                </div>
                <!-- عرض مرجع الفاتورة والمبلغ -->
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-6 border-end">
                            <div class="small text-muted">Référence</div>
                            <div class="fw-bold" th:text="${mission.factureRef}"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="small text-muted">Montant</div>
                            <div class="fw-bold text-success fs-5"
                                 th:text="${#numbers.formatDecimal(mission.montantFacture,1,'WHITESPACE',3,'POINT') + ' TND'}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Formulaire تعديل الفاتورة (يظهر بالـ collapse) -->
                <div class="collapse" id="formModifierFacture">
                    <div class="card-body border-top">
                        <form th:action="@{/avocat/affaires/{aId}/missions/{mId}/facture/modifier(
                                          aId=${affaire.id},mId=${mission.id})}"
                              method="post">
                            <!-- حقل تعديل المرجع -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Référence</label>
                                <input type="text" name="factureRef" class="form-control"
                                       th:value="${mission.factureRef}" required>
                            </div>
                            <!-- حقل تعديل المبلغ -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Montant (TND)</label>
                                <input type="number" name="montantFacture" class="form-control"
                                       step="0.001" min="0"
                                       th:value="${mission.montantFacture}" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-warning"
                                        onclick="return confirm('Confirmer la modification ?')">
                                    <i class="bi bi-save me-1"></i>Enregistrer
                                </button>
                                <button type="button" class="btn btn-outline-secondary"
                                        data-bs-toggle="collapse"
                                        data-bs-target="#formModifierFacture">
                                    Annuler
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ── Formulaire إضافة فاتورة جديدة (يظهر فقط كان statut == 'PV_SOUMIS') ── -->
            <div class="card shadow-sm" th:classappend="${mission.statut.name() != 'PV_SOUMIS'} ? 'opacity-75' : ''">
                <div class="card-header fw-semibold bg-white">
                    <i class="bi bi-pencil-square me-1"></i>
                    <span th:text="${mission.statut.name() == 'FACTURE_SOUMISE'} ? 'Consultation de la facture' : 'Rédiger la facture'"></span>
                </div>
                <div class="card-body">
                    <form th:action="@{/avocat/affaires/{aId}/missions/{mId}/facture(aId=${affaire.id}, mId=${mission.id})}" method="post">

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Référence de la facture <span class="text-danger" th:if="${mission.statut.name() == 'PV_SOUMIS'}">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-hash"></i></span>
                                <input type="text" name="factureRef" class="form-control" 
                                       placeholder="Ex : FACT-2026-04" 
                                       th:value="${mission.factureRef}"
                                       th:readonly="${mission.statut.name() != 'PV_SOUMIS'}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Montant des honoraires (TND) <span class="text-danger" th:if="${mission.statut.name() == 'PV_SOUMIS'}">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-cash-coin"></i></span>
                                <input type="number" name="montantFacture" class="form-control" step="0.001" min="0" 
                                       placeholder="0.000"
                                       th:value="${mission.montantFacture}"
                                       th:readonly="${mission.statut.name() != 'PV_SOUMIS'}" required>
                                <span class="input-group-text fw-bold">DT</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2" th:if="${mission.statut.name() == 'PV_SOUMIS'}">
                            <button type="submit" class="btn btn-primary px-4"
                                    onclick="return confirm('Voulez-vous vraiment soumettre cette facture ?')">
                                <i class="bi bi-send-check me-1"></i> Soumettre à la BNA
                            </button>
                            <a th:href="@{/avocat/affaires/{id}(id=${affaire.id})}" class="btn btn-outline-secondary">Annuler</a>
                        </div>

                        <div th:if="${mission.statut.name() == 'EN_COURS'}" class="alert alert-warning mb-0">
                            <i class="bi bi-exclamation-circle me-1"></i>
                            Veuillez d'abord soumettre le <strong>PV de mission</strong> avant de pouvoir facturer.
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
