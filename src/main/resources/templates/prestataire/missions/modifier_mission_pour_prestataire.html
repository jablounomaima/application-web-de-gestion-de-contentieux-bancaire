<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier résultat mission</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .section-title { font-size: 1.1rem; font-weight: 600; color: #0d6efd; }
    </style>
</head>

<body class="bg-light">
<div class="container py-5" style="max-width: 850px;">

    <!-- HEADER -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/prestataire/missions/{id}(id=${mission.id})}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Retour
        </a>
        <h4 class="mb-0">Modifier le résultat de la mission</h4>
        <span class="badge bg-primary ms-auto" th:text="${mission.statut}"></span>
    </div>

    <!-- ALERTES -->
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
    </div>
    <div th:if="${success}" class="alert alert-success">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
    </div>

    <!-- FORMULAIRE -->
    <form th:action="@{/prestataire/missions/{id}/resultat/modifier(id=${mission.id})}"
          method="post"
          enctype="multipart/form-data">

        <!-- COMMENTAIRE -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <h6 class="section-title"><i class="bi bi-chat-text me-2"></i> Commentaire général</h6>
            </div>
            <div class="card-body">
                <textarea name="commentaire"
                          class="form-control"
                          rows="4"
                          placeholder="Commentaire général sur le résultat..."
                          th:text="${resultat?.commentaire}"></textarea>
            </div>
        </div>

        <!-- PV -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <h6 class="section-title"><i class="bi bi-file-text me-2"></i> PV de mission</h6>
            </div>
            <div class="card-body">
                <textarea name="pvTexte"
                          class="form-control"
                          rows="8"
                          placeholder="Rédigez ou modifiez le PV complet..."
                          th:text="${mission.pvMission}"></textarea>
                <small class="text-muted">Le PV sera visible par l'agent.</small>
            </div>
        </div>

        <!-- FACTURE -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <h6 class="section-title"><i class="bi bi-receipt me-2"></i> Facture</h6>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Montant (TND)</label>
                        <input type="number"
                               name="montant"
                               class="form-control"
                               step="0.01"
                               th:value="${mission.montantFacture}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Référence facture</label>
                        <input type="text"
                               name="factureRef"
                               class="form-control"
                               placeholder="FAC-2026-XXX"
                               th:value="${mission.factureRef}">
                    </div>
                </div>
            </div>
        </div>

        <!-- DOCUMENTS -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <h6 class="section-title"><i class="bi bi-paperclip me-2"></i> Documents</h6>
            </div>
            <div class="card-body">

                <!-- FICHIERS EXISTANTS -->
                <div th:if="${resultat != null and !#lists.isEmpty(resultat.fichiers)}" class="mb-4">
                    <label class="form-label">Fichiers déjà soumis :</label>
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between align-items-center"
                            th:each="f : ${resultat.fichiers}">
                            <div>
                                <i class="bi bi-file-earmark me-2"></i>
                                <span th:text="${f.nomFichierOriginal}"></span>
                                <small class="text-muted ms-2" th:text="${f.tailleFormatee}"></small>
                            </div>
                        </li>
                    </ul>
                </div>

                <!-- UPLOAD -->
                <div>
                    <label class="form-label fw-semibold">Ajouter de nouveaux fichiers</label>
                    <input type="file" name="fichiers" multiple class="form-control">
                    <small class="text-muted">PDF, Word, images, Excel — plusieurs fichiers autorisés</small>
                </div>

            </div>
        </div>

        <!-- ACTIONS -->
        <div class="d-flex gap-3">
            <button type="submit" class="btn btn-success px-5">
                <i class="bi bi-save me-2"></i> Enregistrer
            </button>
            <a th:href="@{/prestataire/missions/{id}(id=${mission.id})}"
               class="btn btn-outline-secondary px-5">Annuler</a>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
