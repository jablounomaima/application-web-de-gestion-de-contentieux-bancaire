<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un validateur - Administration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fc; }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46a0 100%);
        }
        .form-label { font-weight: 500; }
        .required::after {
            content: " *";
            color: red;
        }
    </style>
</head>
<body>

<div class="container mt-4" style="max-width: 800px;">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="fas fa-user-edit me-2"></i>
                Modifier le validateur
            </h4>
            <a th:href="@{/admin/validateurs}" class="btn btn-light btn-sm">
                <i class="fas fa-arrow-left me-1"></i> Retour
            </a>
        </div>

        <div class="card-body p-4">

            <!-- Message d'erreur -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!--
                ACTION  : /admin/validateurs/{id}/update  (correspond au @PostMapping du contrôleur)
                OBJET   : validateur = ValidateurCreationRequest
                          → champs : username, email, nom, prenom, matricule, telephone, type, agenceId
            -->
            <form th:action="@{/admin/validateurs/{id}/update(id=${validateurId})}"
                  th:object="${validateur}"
                  method="post">

                <!-- Token CSRF obligatoire -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="row g-3">

                    <!-- ── Matricule ─────────────────────────────────── -->
                    <div class="col-md-6">
                        <label for="matricule" class="form-label required">Matricule</label>
                        <input type="text"
                               id="matricule"
                               th:field="*{matricule}"
                               class="form-control"
                               placeholder="Ex: MAT-001"
                               required />
                    </div>

                    <!-- ── Username ──────────────────────────────────── -->
                    <div class="col-md-6">
                        <label for="username" class="form-label required">Nom d'utilisateur</label>
                        <input type="text"
                               id="username"
                               th:field="*{username}"
                               class="form-control"
                               placeholder="Ex: jdupont"
                               required />
                    </div>

                    <!-- ── Prénom ─────────────────────────────────────── -->
                    <div class="col-md-6">
                        <label for="prenom" class="form-label required">Prénom</label>
                        <input type="text"
                               id="prenom"
                               th:field="*{prenom}"
                               class="form-control"
                               placeholder="Ex: Jean"
                               required />
                    </div>

                    <!-- ── Nom ───────────────────────────────────────── -->
                    <div class="col-md-6">
                        <label for="nom" class="form-label required">Nom</label>
                        <input type="text"
                               id="nom"
                               th:field="*{nom}"
                               class="form-control"
                               placeholder="Ex: Dupont"
                               required />
                    </div>

                    <!-- ── Email ─────────────────────────────────────── -->
                    <div class="col-md-6">
                        <label for="email" class="form-label required">Email</label>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Ex: jean.dupont@banque.com"
                               required />
                    </div>

                    <!-- ── Téléphone ──────────────────────────────────── -->
                    <div class="col-md-6">
                        <label for="telephone" class="form-label">Téléphone</label>
                        <input type="text"
                               id="telephone"
                               th:field="*{telephone}"
                               class="form-control"
                               placeholder="Ex: +216 XX XXX XXX" />
                    </div>

                    <!-- ── Type de validateur ────────────────────────── -->
                    <!--
                        ATTENTION : le champ s'appelle "type" dans ValidateurCreationRequest
                                    (getter : getType() / setter : setType())
                                    PAS "typeValidateur"
                    -->
                    <div class="col-md-6">
                        <label for="type" class="form-label required">Type de validateur</label>
                        <select id="type"
                                th:field="*{type}"
                                class="form-select"
                                required>
                            <option value="">-- Sélectionner un type --</option>
                            <option th:each="t : ${types}"
                                    th:value="${t}"
                                    th:text="${t.name().replace('_', ' ')}">
                            </option>
                        </select>
                    </div>

                    <!-- ── Agence ─────────────────────────────────────── -->
                    <div class="col-md-6">
                        <label for="agenceId" class="form-label required">Agence</label>
                        <select id="agenceId"
                                th:field="*{agenceId}"
                                class="form-select"
                                required>
                            <option value="">-- Sélectionner une agence --</option>
                            <option th:each="a : ${agences}"
                                    th:value="${a.id}"
                                    th:text="${a.nom}">
                            </option>
                        </select>
                    </div>

                    <!-- ── Nouveau mot de passe (optionnel) ──────────── -->
                    <div class="col-12">
                        <label for="password" class="form-label">
                            Nouveau mot de passe
                            <small class="text-muted">(laisser vide pour ne pas changer)</small>
                        </label>
                        <input type="password"
                               id="password"
                               th:field="*{password}"
                               class="form-control"
                               placeholder="Laisser vide pour conserver l'actuel" />
                    </div>

                </div><!-- /row -->

                <!-- ── Boutons ───────────────────────────────────────── -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Enregistrer les modifications
                    </button>
                    <a th:href="@{/admin/validateurs}" class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i>Annuler
                    </a>
                </div>

            </form>
        </div><!-- /card-body -->
    </div><!-- /card -->
</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
