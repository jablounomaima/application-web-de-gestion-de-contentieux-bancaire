<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Validateurs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background-color: #f4f6f9; }
        .container { margin-top: 30px; }
        .badge-green { background-color: #28a745; color: white; padding: 5px 10px; border-radius: 8px; }
        .badge-purple { background-color: #6f42c1; color: white; padding: 5px 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4">Liste de tous les Validateurs</h2>

    <!-- ✅ bouton ajouter -->
    <a class="btn btn-primary mb-3" th:href="@{/admin/validateurs/new}">
        + Ajouter Validateur
    </a>

    <!-- ✅ TABLE PRINCIPALE -->
    <table class="table table-bordered table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Username</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Email</th>
            <th>Type</th>
            <th>Agence</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="v : ${validateursFinanciers}">
            <td th:text="${v.username}"></td>
            <td th:text="${v.nom}"></td>
            <td th:text="${v.prenom}"></td>
            <td th:text="${v.email}"></td>

            <!-- ✅ FIX TYPE -->
            <td>
                <span th:text="${v.typeValidateur}"
                      th:class="${v.typeValidateur.name() == 'VALIDATEUR_FINANCIER'} ? 'badge-green' : 'badge-purple'">
                </span>
            </td>

            <!-- ✅ FIX AGENCE -->
            <td th:text="${v.agenceNom != null ? v.agenceNom : '---'}"></td>

            <td>
                <!-- ✅ FIX URL -->
                <a th:href="@{/admin/validateurs/{id}/edit(id=${v.id})}">Modifier</a>
                  

                <form th:action="@{'/admin/validateurs/' + ${v.id} + '/delete'}"
                      method="post"
                      style="display:inline;">
                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Supprimer ?')">
                        Supprimer
                    </button>
                </form>
            </td>
        </tr>

        <!-- VALIDATEURS JURIDIQUES -->
        <tr th:each="v : ${validateursJuridiques}">
            <td th:text="${v.username}"></td>
            <td th:text="${v.nom}"></td>
            <td th:text="${v.prenom}"></td>
            <td th:text="${v.email}"></td>

            <td>
                <span th:text="${v.typeValidateur}"
                      class="badge-purple">
                </span>
            </td>

            <td th:text="${v.agenceNom != null ? v.agenceNom : '---'}"></td>

            <td>
                <a class="btn btn-sm btn-warning"
                   th:href="@{/admin/validateurs/{id}/edit(id=${v.id})}">
                    Modifier
                </a>

                <form th:action="@{'/admin/validateurs/' + ${v.id} + '/delete'}"
                      method="post"
                      style="display:inline;">
                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Supprimer ?')">
                        Supprimer
                    </button>
                </form>
            </td>
        </tr>

        </tbody>
    </table>

</div>

</body>
</html>
