<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ajouter Validateur</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            margin-top: 40px;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card shadow">

        <h3 class="mb-4">Créer un Validateur</h3>

        <!-- SUCCESS / ERROR -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- FORM -->
        <form th:action="@{/admin/validateurs}" th:object="${validateur}" method="post">

            <!-- CSRF (IMPORTANT Spring Security) -->
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <!-- USERNAME -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" th:field="*{username}" required>
            </div>

            <!-- PRENOM -->
            <div class="mb-3">
                <label class="form-label">Prénom</label>
                <input type="text" class="form-control" th:field="*{prenom}" required>
            </div>

            <!-- NOM -->
            <div class="mb-3">
                <label class="form-label">Nom</label>
                <input type="text" class="form-control" th:field="*{nom}" required>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>

            <!-- TELEPHONE -->
            <div class="mb-3">
                <label class="form-label">Téléphone</label>
                <input type="text" class="form-control" th:field="*{telephone}">
            </div>

            <!-- MOT DE PASSE -->
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" class="form-control" th:field="*{password}" required>
            </div>

            <!-- TYPE -->
            <div class="mb-3">
                <label class="form-label">Type Validateur</label>
                <select class="form-control" th:field="*{type}" required>
                    <option value="" disabled selected>Choisir un type</option>
                    <option th:each="t : ${types}"
                            th:value="${t}"
                            th:text="${t}">   <!-- FIX: éviter t.libelle si enum -->
                    </option>
                </select>
            </div>

            <!-- AGENCE -->
            <div class="mb-3">
                <label class="form-label">Agence</label>
                <select class="form-control" th:field="*{agenceId}" required>
                    <option value="" disabled selected>Choisir une agence</option>
                    <option th:each="a : ${agences}"
                            th:value="${a.id}"
                            th:text="${a.nom}">
                    </option>
                </select>
            </div>

            <!-- MATRICULE -->
            <div class="mb-3">
                <label class="form-label">Matricule</label>
                <input type="text" class="form-control" th:field="*{matricule}" required>
            </div>

            <!-- BUTTONS -->
            <button type="submit" class="btn btn-success">
                Enregistrer
            </button>

            <a th:href="@{/admin/validateurs}" class="btn btn-secondary">
                Annuler
            </a>

        </form>

    </div>

</div>

</body>
</html>
