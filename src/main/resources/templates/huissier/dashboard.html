<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Dashboard Huissier')}"></head>

<body>

<nav th:replace="~{fragments/layout :: sidebar('HUISSIER', ${#authentication != null ? #authentication.name : 'Utilisateur'})}"></nav>

<main class="main" style="margin-left: 260px; padding: 20px; max-width: 1200px; margin-right: auto;">

    <!-- HEADER -->
    <div class="page-header">
        <h1>Dashboard Huissier</h1>
        <p>
            Bienvenue,
            <strong th:text="${#authentication != null ? #authentication.name : 'Huissier'}"></strong>
        </p>
    </div>

    <!-- STATISTIQUES -->
    <div class="cards cards-4" style="margin-top:20px;">
        <div class="card stat-card blue">
            <div class="label">Missions actives</div>
            <div class="value" th:text="${missionsActives ?: 0}">0</div>
        </div>
        <div class="card stat-card warn">
            <div class="label">PV soumis</div>
            <div class="value" th:text="${rapportsAttente ?: 0}">0</div>
        </div>
        <div class="card stat-card red">
            <div class="label">En retard</div>
            <div class="value" th:text="${contreExpertises ?: 0}">0</div>
        </div>
        <div class="card stat-card green">
            <div class="label">Terminées</div>
            <div class="value" th:text="${evaluationsFinalisees ?: 0}">0</div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrap" style="margin-top:24px;">
        <div class="table-head">
            <h2>Mes missions assignées</h2>
            <a th:href="@{/prestataire/missions}" class="btn btn-outline"
               style="font-size:12px;">Toutes les missions</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>N° Mission</th>
                    <th>Dossier</th>
                    <th>Client</th>
                    <th>Description</th>
                    <th>Échéance</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="m : ${dernieresMissions}">

                    <!-- N° Mission -->
                    <td th:text="${m.numeroMission ?: '—'}"></td>

                    <!-- Dossier -->
                    <td th:text="${m.prestation != null and m.prestation.dossier != null
                                   ? m.prestation.dossier.numeroDossier : '—'}"></td>

                    <!-- Client -->
                    <td th:text="${m.prestation != null
                                   and m.prestation.dossier != null
                                   and m.prestation.dossier.client != null
                                   ? m.prestation.dossier.client.nom + ' '
                                     + (m.prestation.dossier.client.prenom ?: '')
                                   : '—'}"></td>

                    <!-- Description -->
                    <td th:text="${m.description ?: '—'}"></td>

                    <!-- Échéance -->
                    <td th:text="${m.dateFinPrevue != null
                                   ? #temporals.format(m.dateFinPrevue, 'dd/MM/yyyy')
                                   : '—'}"></td>

                    <!-- ✅ STATUT — th:class remplace th:classappend pour éviter
                         les erreurs de parsing avec les ternaires imbriqués      -->
                    <td>
                        <span th:with="s=${m.statut.name()}"
                        th:class="${s == 'ASSIGNEE'}         ? 'badge badge-secondary' :
                                  (s == 'EN_COURS'           ? 'badge badge-primary'   :
                                  (s == 'PV_SOUMIS'          ? 'badge badge-info'      :
                                  (s == 'FACTURE_SOUMISE'    ? 'badge badge-warning'   :
                                  (s == 'TERMINEE'           ? 'badge badge-success'   :
                                  (s == 'REJETEE'            ? 'badge badge-danger'    :
                                   'badge badge-light')))))"
                        th:text="${m.statut.libelle}">
                  </span>
                    </td>

                    <!-- ACTIONS -->
                    <td style="display:flex; flex-direction:column; gap:8px;">

                        <!-- Voir -->
                        <a th:href="@{/prestataire/missions/{id}(id=${m.id})}"
                           class="btn btn-outline"
                           style="padding:5px 12px; font-size:12px; text-decoration:none;">
                            👁 Voir
                        </a>

                       <!-- ✅ Mission rejetée — correction ANNULEE → REJETEE -->
    <div th:if="${m.statut.name() == 'REJETEE' and m.commentaireAgent != null}"
    style="background:#ffe6e6; border-left:4px solid #e74c3c;
           padding:8px; font-size:11px; border-radius:6px;">
   <b>❌ Mission rejetée par l'agent</b><br/>
   <span th:text="${m.commentaireAgent}"></span>
</div>


                        <!-- Mission validée / terminée -->
                        <div th:if="${m.statut.name() == 'TERMINEE'}"
                             style="background:#e8f8f5; border-left:4px solid #27ae60;
                                    padding:8px; font-size:11px; border-radius:6px;">
                            <b>✔ Mission validée</b>
                            <span th:if="${m.commentaireAgent != null}"
                                  th:text="|: ${m.commentaireAgent}|"></span>
                        </div>

                    </td>

                </tr>

                <!-- Ligne vide -->
                <tr th:if="${#lists.isEmpty(dernieresMissions)}">
                    <td colspan="7" style="text-align:center;">
                        Aucune mission assignée.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
